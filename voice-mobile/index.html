<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000a14">
<link rel="manifest" href="manifest.json">
<title>ZARA</title>
<style>
  :root {
    --bg: #000a14;
    --accent: #00d4ff;
    --accent-dim: rgba(0,212,255,0.15);
    --accent-glow: rgba(0,212,255,0.4);
    --text: #c8dce8;
    --text-dim: #3a5068;
    --green: #00e676;
    --red: #ff3d57;
    --amber: #ffab40;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── Ambient Background ── */
  #ambientBg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 35%, rgba(0,212,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 80%, rgba(0,100,200,0.03) 0%, transparent 50%),
                var(--bg);
  }

  /* ── Top Bar ── */
  .topbar {
    position: relative; z-index: 10;
    padding: 8px 16px;
    padding-top: max(8px, var(--safe-top));
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; flex-shrink: 0;
    background: rgba(0,10,20,0.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .topbar-left { display:flex; align-items:center; gap:8px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--text-dim); transition:all 0.3s; flex-shrink:0; }
  .status-dot.listening { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status-dot.thinking { background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulse 0.8s infinite; }
  .status-dot.speaking { background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulse 0.5s infinite; }
  .status-dot.error { background:var(--red); box-shadow:0 0 6px var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .brand { font-size:13px; font-weight:700; letter-spacing:3px; color:var(--accent); }
  .topbar-right { display:flex; gap:6px; }
  .icon-btn { background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:6px; border-radius:8px; }
  .icon-btn:active { color:var(--accent); background:var(--accent-dim); }

  /* ── Face Area (takes most of screen) ── */
  #faceArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    min-height: 0;
  }
  #faceCanvas { display: block; max-width: 100%; max-height: 100%; }
  .state-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 8px;
    transition: color 0.3s;
  }
  .state-label.active { color: var(--accent); }
  .transcript-live {
    font-size: 14px;
    color: rgba(200,220,232,0.7);
    text-align: center;
    max-width: 80%;
    min-height: 20px;
    margin-top: 6px;
    line-height: 1.4;
  }

  /* ── Bottom Controls ── */
  .bottom {
    position: relative; z-index: 10;
    flex-shrink: 0;
    padding: 12px 20px;
    padding-bottom: max(16px, calc(16px + var(--safe-bottom));
    background: rgba(0,10,20,0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .attach-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0,212,255,0.2);
    background: transparent; color: var(--accent); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .attach-btn:active { background: var(--accent-dim); }

  .mic-btn {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(0,212,255,0.3);
    background: rgba(0,212,255,0.05);
    color: var(--accent); font-size: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s; position: relative;
  }
  .mic-btn:active { transform: scale(0.93); }
  .mic-btn.listening {
    background: var(--green); border-color: var(--green); color: #000;
    box-shadow: 0 0 0 8px rgba(0,230,118,0.12), 0 0 40px rgba(0,230,118,0.15);
    animation: micGlow 1.5s infinite;
  }
  .mic-btn.speaking {
    background: var(--accent); border-color: var(--accent); color: #000;
    box-shadow: 0 0 0 8px var(--accent-dim), 0 0 40px rgba(0,212,255,0.15);
    animation: micGlow 0.8s infinite;
  }
  .mic-btn.thinking { border-color: var(--amber); color: var(--amber); }
  .mic-btn:disabled { opacity: 0.25; pointer-events: none; }
  @keyframes micGlow { 0%,100%{box-shadow:0 0 0 8px rgba(0,212,255,0.08)} 50%{box-shadow:0 0 0 16px rgba(0,212,255,0.02)} }

  .end-btn {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255,61,87,0.4);
    background: rgba(255,61,87,0.1);
    color: var(--red); font-size: 22px; font-weight: bold;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .end-btn.visible { display: flex; }
  .end-btn:active { background: rgba(255,61,87,0.2); transform: scale(0.93); }

  /* Hidden file input for camera/gallery */
  #fileInput { display: none; }

  /* ── Permission Overlay ── */
  .perm-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,8,16,0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 40px;
  }
  .perm-overlay.hidden { display: none; }
  .perm-icon { font-size: 48px; }
  .perm-title { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .perm-desc { font-size: 14px; color: var(--text-dim); text-align: center; line-height: 1.6; max-width: 300px; }
  .perm-btn {
    margin-top: 10px; padding: 14px 40px; border: none; border-radius: 30px;
    background: var(--accent); color: #000; font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
  }
  .perm-btn:active { transform: scale(0.95); }
  .perm-btn:disabled { opacity: 0.5; pointer-events: none; }
  .perm-status { font-size: 12px; color: var(--text-dim); }

  /* ── Settings Panel ── */
  .panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; opacity:0; pointer-events:none; transition:opacity 0.3s; }
  .panel-overlay.open { opacity:1; pointer-events:auto; }
  .panel {
    position:fixed; bottom:0; left:0; right:0;
    background: #0a1018; border-radius: 20px 20px 0 0; border-top: 1px solid rgba(0,212,255,0.1);
    padding: 16px 20px; padding-bottom: max(24px, calc(20px + var(--safe-bottom)));
    z-index:101; transform:translateY(100%);
    transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
    max-height:75dvh; overflow-y:auto;
  }
  .panel.open { transform:translateY(0); }
  .panel-handle { width:32px; height:3px; background:rgba(255,255,255,0.12); border-radius:2px; margin:0 auto 14px; }
  .panel h2 { font-size:14px; color:var(--accent); letter-spacing:2px; margin-bottom:14px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:10px; color:var(--text-dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
  .field input, .field select {
    width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
    border-radius:8px; padding:9px 12px; color:var(--text); font-size:13px; outline:none;
  }
  .field input:focus, .field select:focus { border-color:var(--accent); }
  .field .hint { font-size:10px; color:var(--text-dim); margin-top:3px; }
  .btn-row { display:flex; gap:8px; margin-top:14px; }
  .btn { flex:1; padding:10px; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#000; }
  .btn-secondary { background:rgba(255,255,255,0.06); color:var(--text); }

  /* ── Chat history (minimal, accessible via settings) ── */
  .mini-chat {
    position: fixed; inset: 0; z-index: 90;
    background: var(--bg);
    display: none; flex-direction: column;
  }
  .mini-chat.visible { display: flex; }
  .mini-chat-header { padding:12px 16px; padding-top:max(12px, var(--safe-top)); display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.06); background:rgba(0,10,20,0.9); }
  .mini-chat-header .back-btn { background:none; border:none; color:var(--accent); font-size:20px; cursor:pointer; }
  .mini-chat-body { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:6px; }
  .mc-msg { max-width:85%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.4; word-break:break-word; }
  .mc-msg.user { align-self:flex-end; background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.1); }
  .mc-msg.assistant { align-self:flex-start; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); }
  .mc-msg.system { align-self:center; font-size:11px; color:var(--text-dim); background:none; border:none; }
  .mc-msg img { max-width:100%; border-radius:8px; margin-top:4px; }
  .mc-img-preview { max-width:120px; border-radius:8px; margin-top:4px; cursor:pointer; }
</style>
</head>
<body>

<div id="ambientBg"></div>

<!-- Permission Gate -->
<div class="perm-overlay" id="permOverlay">
  <div class="perm-icon">&#x1F916;</div>
  <div class="perm-title">ZARA</div>
  <div class="perm-desc" id="permDesc">I need access to your microphone and speakers to have a voice conversation with you. Tap below to grant permission.<br><br><span style="color:var(--accent);font-size:11px;">v3.0 — Voice-First Build</span></div>
  <button class="perm-btn" id="permBtn">GRANT ACCESS</button>
  <div class="perm-status" id="permStatus"></div>
</div>

<!-- Main App -->
<div class="topbar">
  <div class="topbar-left">
    <div class="status-dot" id="statusDot"></div>
    <span class="brand">ZARA</span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="chatBtn" title="Conversation log">&#x1F4AC;</button>
    <button class="icon-btn" id="settingsBtn" title="Settings">&#x2699;</button>
  </div>
</div>

<div id="faceArea">
  <canvas id="faceCanvas"></canvas>
  <div class="state-label" id="stateLabel">STANDBY</div>
  <div class="transcript-live" id="liveTranscript"></div>
</div>

<div class="bottom">
  <button class="attach-btn" id="attachBtn" title="Send image">&#x1F4F7;</button>
  <input type="file" id="fileInput" accept="image/*,video/*">
  <button class="mic-btn" id="micBtn" disabled>&#x1F3A4;</button>
  <button class="end-btn" id="endBtn" title="Stop">&#x26D4;</button>
</div>

<!-- Mini Chat Log -->
<div class="mini-chat" id="miniChat">
  <div class="mini-chat-header">
    <button class="back-btn" id="chatBack">&#x2190;</button>
    <span style="font-weight:600;letter-spacing:1px;">CONVERSATION</span>
  </div>
  <div class="mini-chat-body" id="chatLog"></div>
</div>

<!-- Settings Panel -->
<div class="panel-overlay" id="settingsOverlay"></div>
<div class="panel" id="settingsPanel">
  <div class="panel-handle"></div>
  <h2>CONFIGURATION</h2>
  <div class="field">
    <label>OpenRouter API Key</label>
    <input type="text" id="setKey" placeholder="sk-or-v1-...">
    <div class="hint">Required. Free key at openrouter.ai/keys</div>
  </div>
  <div class="field">
    <label>Supabase URL (optional)</label>
    <input type="url" id="setSupaUrl" placeholder="https://xxxx.supabase.co">
  </div>
  <div class="field">
    <label>Supabase Anon Key (optional)</label>
    <input type="text" id="setSupaKey" placeholder="eyJ...">
  </div>
  <div class="field">
    <label>Model</label>
    <select id="setModel">
      <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B (free)</option>
      <option value="google/gemma-4-31b-it:free">Gemma 4 31B (free)</option>
      <option value="meta-llama/llama-4-maverick:free">Llama 4 Maverick (free)</option>
      <option value="nvidia/nemotron-nano-12b-v2-vl:free">Nemotron Vision (free, eyes)</option>
    </select>
  </div>
  <div class="field">
    <label>Voice</label>
    <select id="setVoice"><option value="">Auto</option></select>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="settingsCancel">Cancel</button>
    <button class="btn btn-primary" id="settingsSave">Save</button>
  </div>
</div>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw2.js').then(r=>{console.log('SW v3 registered')});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}</script>
<script src="./voice-config.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  ZARA — Voice-First Jarvis AI with Realistic Face & Vision
// ═══════════════════════════════════════════════════════════════════

const CFG = window.ZARA_CONFIG || {};

const S = {
  key: localStorage.getItem('vl_key') || CFG.openRouterKey || '',
  supaUrl: localStorage.getItem('vl_supaUrl') || CFG.supabaseUrl || '',
  supaKey: localStorage.getItem('vl_supaKey') || CFG.supabaseKey || '',
  model: localStorage.getItem('vl_model') || CFG.model || 'google/gemma-4-26b-a4b-it:free',
  voiceName: localStorage.getItem('vl_voiceName') || '',
  messages: [],
  isListening: false,
  isThinking: false,
  isSpeaking: false,
  recognition: null,
  synth: window.speechSynthesis,
  supabase: null,
  ttsReady: false,
  micReady: false,
  mouthOpen: 0,      // 0-1 how open the mouth is
  eyeX: 0, eyeY: 0,  // pupil offset
  blinkTimer: 0,
  speaking: false,    // face animation state
};

// ── DOM ──
const $ = id => document.getElementById(id);
const $dot = $('statusDot'), $mic = $('micBtn'), $endBtn = $('endBtn');
const $state = $('stateLabel'), $live = $('liveTranscript');
const $perm = $('permOverlay'), $permBtn = $('permBtn'), $permStatus = $('permStatus');
const $chatLog = $('chatLog');

// ═══════════════════════════════════════════════════════
//  REALISTIC JARVIS FACE — Canvas 2D
// ═══════════════════════════════════════════════════════
const canvas = $('faceCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, faceScale;
let frame = 0;

function resize() {
  const area = $('faceArea');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = area.clientWidth;
  H = area.clientHeight - 50; // leave room for labels
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  faceScale = Math.min(W / 320, H / 400, 1.3);
}

function drawFace() {
  frame++;
  const t = frame * 0.02;
  ctx.clearRect(0, 0, W, H);

  const sc = faceScale;
  const isIdle = !S.isListening && !S.isThinking && !S.isSpeaking;
  const intensity = isIdle ? 0.3 : S.isListening ? 0.6 : S.isThinking ? 0.8 : 1.0;

  // -- Background glow --
  const bgG = ctx.createRadialGradient(cx, cy - 20*sc, 10, cx, cy - 20*sc, 160*sc);
  bgG.addColorStop(0, `rgba(0,180,255,${0.08*intensity})`);
  bgG.addColorStop(0.5, `rgba(0,100,200,${0.02*intensity})`);
  bgG.addColorStop(1, 'transparent');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  // -- Head shape --
  const headW = 90 * sc;
  const headH = 115 * sc;
  const headY = cy - 15 * sc;

  // Head glow
  ctx.save();
  ctx.shadowColor = `rgba(0,212,255,${0.3*intensity})`;
  ctx.shadowBlur = 30 * intensity;
  ctx.beginPath();
  ctx.ellipse(cx, headY, headW, headH, 0, 0, Math.PI * 2);
  const headGrad = ctx.createLinearGradient(cx, headY - headH, cx, headY + headH);
  headGrad.addColorStop(0, `rgba(0,140,200,${0.08*intensity})`);
  headGrad.addColorStop(0.5, `rgba(0,80,120,${0.05*intensity})`);
  headGrad.addColorStop(1, `rgba(0,40,80,${0.03*intensity})`);
  ctx.fillStyle = headGrad;
  ctx.fill();
  ctx.restore();

  // Head outline
  ctx.strokeStyle = `rgba(0,212,255,${0.25*intensity})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(cx, headY, headW, headH, 0, 0, Math.PI * 2);
  ctx.stroke();

  // -- Holographic scan lines on face --
  for (let i = 0; i < 12; i++) {
    const ly = headY - headH + (i + 1) * (headH * 2 / 13);
    const la = 0.03 + Math.sin(t * 0.8 + i * 0.5) * 0.02;
    ctx.strokeStyle = `rgba(0,212,255,${la * intensity})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    // Clip to head ellipse
    const dx = headW * Math.sqrt(Math.max(0, 1 - ((ly - headY) / headH) ** 2));
    ctx.moveTo(cx - dx, ly);
    ctx.lineTo(cx + dx, ly);
  }

  // -- Eyes --
  const eyeY = headY - 18 * sc;
  const eyeSpacing = 32 * sc;
  const eyeW = 22 * sc;
  const eyeH = 10 * sc;

  // Blinking
  S.blinkTimer -= 0.016;
  if (S.blinkTimer <= 0) S.blinkTimer = 2 + Math.random() * 4;
  const blinking = S.blinkTimer < 0.15;
  const blinkScale = blinking ? Math.max(0.05, S.blinkTimer / 0.15) : 1;

  for (let side = -1; side <= 1; side += 2) {
    const ex = cx + side * eyeSpacing;

    // Eye socket
    ctx.strokeStyle = `rgba(0,212,255,${0.2 * intensity})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(ex, eyeY, eyeW + 3, eyeH + 4, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Eye glow
    const eGlow = ctx.createRadialGradient(ex, eyeY, 0, ex, eyeY, eyeW);
    eGlow.addColorStop(0, `rgba(0,212,255,${0.15 * intensity})`);
    eGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = eGlow;
    ctx.beginPath();
    ctx.ellipse(ex, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fill();

    // Iris
    const irisR = 7 * sc;
    const pupilOffX = S.eyeX * 3 * sc;
    const pupilOffY = S.eyeY * 2 * sc;

    ctx.fillStyle = `rgba(0,200,255,${0.9 * intensity})`;
    ctx.beginPath();
    ctx.ellipse(ex + pupilOffX, eyeY + pupilOffY, irisR, irisR * blinkScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = `rgba(0,40,80,${intensity})`;
    ctx.beginPath();
    ctx.arc(ex + pupilOffX, eyeY + pupilOffY, 3 * sc * blinkScale, 0, Math.PI * 2);
    ctx.fill();

    // Eye bright spot
    ctx.fillStyle = `rgba(255,255,255,${0.7 * intensity * blinkScale})`;
    ctx.beginPath();
    ctx.arc(ex + pupilOffX - 2 * sc, eyeY + pupilOffY - 2 * sc, 1.5 * sc * blinkScale, 0, Math.PI * 2);
    ctx.fill();

    // Eyelid (for blink)
    if (blinkScale < 0.8) {
      ctx.fillStyle = `rgba(0,10,20,${(1 - blinkScale) * 0.9})`;
      ctx.beginPath();
      ctx.ellipse(ex, eyeY - eyeH * (1 - blinkScale), eyeW + 2, eyeH * 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // -- Nose --
  ctx.strokeStyle = `rgba(0,212,255,${0.12 * intensity})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(cx, eyeY + 10 * sc);
  ctx.lineTo(cx - 4 * sc, eyeY + 28 * sc);
  ctx.lineTo(cx + 4 * sc, eyeY + 28 * sc);
  ctx.stroke();

  // -- Mouth (lip-synced) --
  const mouthY = eyeY + 42 * sc;
  const mouthW = 28 * sc;
  const mouthOpen = S.mouthOpen; // 0-1
  const mouthH = 3 * sc + mouthOpen * 14 * sc;
  const lipThick = 2 * sc;

  // Mouth outer shape
  ctx.strokeStyle = `rgba(0,212,255,${(0.3 + mouthOpen * 0.3) * intensity})`;
  ctx.lineWidth = lipThick;
  ctx.beginPath();
  if (mouthOpen > 0.05) {
    // Open mouth — upper lip
    ctx.ellipse(cx, mouthY - mouthOpen * 3 * sc, mouthW, Math.max(1, mouthH * 0.5), 0, Math.PI, 0);
    ctx.stroke();
    // Lower lip
    ctx.beginPath();
    ctx.ellipse(cx, mouthY + mouthOpen * 4 * sc, mouthW, Math.max(1, mouthH * 0.6), 0, 0, Math.PI);
    ctx.stroke();
    // Mouth interior
    ctx.fillStyle = `rgba(0,30,60,${0.5 * intensity})`;
    ctx.beginPath();
    ctx.ellipse(cx, mouthY + mouthOpen * 1 * sc, mouthW - 2, Math.max(1, mouthH * 0.45), 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Closed mouth — slight smile
    ctx.beginPath();
    ctx.moveTo(cx - mouthW, mouthY);
    ctx.quadraticCurveTo(cx, mouthY + 5 * sc, cx + mouthW, mouthY);
    ctx.stroke();
  }

  // -- Chin / jaw line --
  ctx.strokeStyle = `rgba(0,212,255,${0.08 * intensity})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(cx - 50 * sc, headY + 70 * sc);
  ctx.quadraticCurveTo(cx, headY + headH + 8 * sc, cx + 50 * sc, headY + 70 * sc);
  ctx.stroke();

  // -- Side tech details --
  for (let side = -1; side <= 1; side += 2) {
    const sx = cx + side * (headW + 15 * sc);
    // Data arcs
    for (let i = 0; i < 4; i++) {
      const r = 8 + i * 7;
      const a = t * 0.4 * side + i * 0.9;
      ctx.strokeStyle = `rgba(0,212,255,${(0.08 - i*0.015) * intensity})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.arc(sx, headY, r * sc, a, a + 0.4);
      ctx.stroke();
    }
    // Connection line to head
    ctx.strokeStyle = `rgba(0,212,255,${0.06 * intensity})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(cx + side * headW, headY - 20 * sc);
    ctx.lineTo(sx, headY - 10 * sc);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + side * headW, headY + 20 * sc);
    ctx.lineTo(sx, headY + 10 * sc);
    ctx.stroke();
  }

  // -- Floating particles --
  for (let i = 0; i < 25; i++) {
    const px = cx + Math.sin(t * 0.3 + i * 1.7) * (120 + i * 4) * sc;
    const py = cy + Math.cos(t * 0.25 + i * 2.1) * (100 + i * 3) * sc;
    const pa = (0.1 + Math.sin(t + i) * 0.08) * intensity;
    ctx.fillStyle = `rgba(0,212,255,${pa})`;
    ctx.beginPath();
    ctx.arc(px, py, (0.5 + Math.sin(i) * 0.5) * sc, 0, Math.PI * 2);
    ctx.fill();
  }

  // -- Circular HUD ring --
  const hudR = Math.min(W, H) * 0.44;
  ctx.strokeStyle = `rgba(0,212,255,${0.04 * intensity})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, hudR, 0, Math.PI * 2);
  ctx.stroke();
  // HUD tick marks
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 + t * 0.1;
    const inner = hudR - (i % 5 === 0 ? 6 : 3);
    ctx.strokeStyle = `rgba(0,212,255,${(i % 5 === 0 ? 0.08 : 0.03) * intensity})`;
    ctx.lineWidth = i % 5 === 0 ? 1 : 0.5;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a) * hudR, cy + Math.sin(a) * hudR);
    ctx.stroke();
  }

  // -- Audio waveform at bottom of face area --
  if (S.isListening || S.isSpeaking) {
    const barCount = 40;
    const barW = 2;
    const totalW = barCount * (barW + 1.5);
    const startX = cx - totalW / 2;
    const baseY = headY + headH + 35 * sc;
    for (let i = 0; i < barCount; i++) {
      const v = S.isSpeaking
        ? (Math.sin(t * 8 + i * 0.6) * 0.4 + 0.5) * (0.2 + Math.random() * 0.5)
        : (Math.sin(t * 3 + i * 0.4) * 0.3 + 0.4);
      const h = v * 12 * sc;
      ctx.fillStyle = `rgba(0,212,255,${(0.1 + v * 0.25) * intensity})`;
      ctx.fillRect(startX + i * (barW + 1.5), baseY - h, barW, h);
    }
  }

  // -- Animate mouth --
  if (S.isSpeaking) {
    // Generate natural-looking mouth movement
    const target = Math.abs(Math.sin(t * 12)) * 0.6 + Math.abs(Math.sin(t * 7.3)) * 0.3 + Math.random() * 0.1;
    S.mouthOpen += (Math.min(1, target) - S.mouthOpen) * 0.3;
  } else if (S.isThinking) {
    S.mouthOpen += (0.05 + Math.sin(t * 2) * 0.03 - S.mouthOpen) * 0.1;
  } else {
    S.mouthOpen += (0 - S.mouthOpen) * 0.15;
  }

  // Smooth eye drift
  if (!S.isListening && !S.isThinking && !S.isSpeaking) {
    S.eyeX += (Math.sin(t * 0.3) * 0.3 - S.eyeX) * 0.02;
    S.eyeY += (Math.cos(t * 0.2) * 0.2 - S.eyeY) * 0.02;
  }

  requestAnimationFrame(drawFace);
}

window.addEventListener('resize', resize);
resize();
drawFace();

// ═══════════════════════════════════════════════════════
//  PERMISSIONS & HARDWARE ACCESS
// ═══════════════════════════════════════════════════════
async function requestPermissions() {
  $permBtn.disabled = true;
  $permStatus.textContent = 'Requesting microphone access...';

  try {
    // Request actual mic stream (this triggers the system permission dialog)
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // Keep stream alive for the session
    window._micStream = stream;
    stream.getTracks().forEach(t => t.enabled = false); // mute until needed
    S.micReady = true;
    $permStatus.textContent = 'Microphone granted. Initializing voice engine...';
  } catch (e) {
    $permStatus.textContent = 'Microphone denied. Voice input unavailable. You can still type.';
    console.warn('[zara] Mic permission denied:', e);
  }

  // Unlock TTS (requires user gesture on mobile)
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    u.rate = 10;
    S.synth.speak(u);
    S.ttsReady = true;
  } catch(e) { console.warn('[zara] TTS init error:', e); }

  // Wait a beat for voices to load
  await new Promise(r => setTimeout(r, 300));

  // Hide permission screen
  $perm.classList.add('hidden');
  $mic.disabled = false;

  // Initialize everything
  initApp();
}

$permBtn.addEventListener('click', requestPermissions);

// ═══════════════════════════════════════════════════════
//  TEXT-TO-SPEECH (Mobile-Optimized)
// ═══════════════════════════════════════════════════════
let ttsKeepAlive = null;

function speak(text) {
  if (!text || !S.synth) return;
  cancelSpeaking();

  // Clean for speech
  let clean = text
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/`(.*?)`/g, '$1')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/#{1,6}\s/g, '')
    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
    .replace(/\n+/g, '. ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!clean) return;

  const chunks = chunkText(clean, 160);
  S.isSpeaking = true;
  $mic.classList.add('speaking');
  $dot.className = 'status-dot speaking';
  $state.textContent = 'SPEAKING';
  $state.classList.add('active');
  $endBtn.classList.add('visible');
  $mic.style.display = 'none';
  speakChunk(chunks, 0);
}

function speakChunk(chunks, i) {
  if (i >= chunks.length || !S.isSpeaking) return;

  const utt = new SpeechSynthesisUtterance(chunks[i]);
  utt.rate = 1.0;
  utt.pitch = 1.0;
  utt.volume = 1.0;

  const voices = S.synth.getVoices();
  if (S.voiceName) {
    const v = voices.find(v => v.name === S.voiceName);
    if (v) utt.voice = v;
  } else {
    // Pick best English voice
    const pref = voices.find(v => v.name.includes('Samantha') && v.lang.startsWith('en'))
      || voices.find(v => v.name.includes('Google') && v.lang.startsWith('en'))
      || voices.find(v => v.name.includes('Daniel') && v.lang.startsWith('en'))
      || voices.find(v => v.lang.startsWith('en') && !v.localService);
    if (pref) utt.voice = pref;
    else {
      const en = voices.find(v => v.lang.startsWith('en'));
      if (en) utt.voice = en;
    }
  }

  utt.onend = () => {
    if (i + 1 < chunks.length && S.isSpeaking) {
      speakChunk(chunks, i + 1);
    } else {
      finishSpeaking();
    }
  };
  utt.onerror = (e) => {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    console.warn('[zara] TTS err:', e.error);
    if (i + 1 < chunks.length && S.isSpeaking) speakChunk(chunks, i + 1);
    else finishSpeaking();
  };

  // Word boundary for mouth sync
  utt.onboundary = (e) => {
    if (e.name === 'word') {
      S.mouthOpen = 0.5 + Math.random() * 0.4;
    }
  };

  S.synth.speak(utt);

  // iOS Safari keep-alive (pauses TTS after ~15s)
  if (chunks[i].length > 80) {
    clearInterval(ttsKeepAlive);
    ttsKeepAlive = setInterval(() => {
      if (S.synth.speaking) { S.synth.pause(); S.synth.resume(); }
      else clearInterval(ttsKeepAlive);
    }, 10000);
  }
}

function finishSpeaking() {
  clearInterval(ttsKeepAlive);
  S.isSpeaking = false;
  S.mouthOpen = 0;
  $mic.classList.remove('speaking');
  $mic.style.display = 'flex';
  $endBtn.classList.remove('visible');
  if (!S.isThinking) {
    $dot.className = 'status-dot';
    $state.textContent = 'STANDBY';
    $state.classList.remove('active');
  }
  // Auto-listen after speaking (conversation flow)
  if (!S.isThinking && S.micReady) {
    setTimeout(() => {
      if (!S.isSpeaking && !S.isThinking) startListening();
    }, 400);
  }
}

function cancelSpeaking() {
  clearInterval(ttsKeepAlive);
  S.synth.cancel();
  S.isSpeaking = false;
  S.mouthOpen = 0;
  $mic.classList.remove('speaking');
  $mic.style.display = 'flex';
  $endBtn.classList.remove('visible');
}

function chunkText(text, maxLen) {
  const chunks = [];
  const sentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
  let cur = '';
  for (const s of sentences) {
    if ((cur + s).length > maxLen && cur) { chunks.push(cur.trim()); cur = s; }
    else cur += s;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks.length ? chunks : [text];
}

function populateVoices() {
  const load = () => {
    const voices = S.synth.getVoices();
    const $sel = $('setVoice');
    $sel.innerHTML = '<option value="">Auto (best English)</option>';
    voices.filter(v => v.lang.startsWith('en')).forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name + (v.localService ? '' : ' (network)');
      $sel.appendChild(o);
    });
    if (S.voiceName) $sel.value = S.voiceName;
  };
  load();
  S.synth.onvoiceschanged = load;
}

// ═══════════════════════════════════════════════════════
//  SPEECH RECOGNITION
// ═══════════════════════════════════════════════════════
function setupSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    $mic.disabled = true;
    $permStatus.textContent += ' Speech recognition not supported in this browser.';
    return;
  }
  S.recognition = new SR();
  S.recognition.continuous = false;
  S.recognition.interimResults = true; // Show live transcript
  S.recognition.lang = 'en-US';

  S.recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (interim) $live.textContent = interim;
    if (final) {
      $live.textContent = '';
      sendMessage(final.trim());
    }
  };
  S.recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.warn('[zara] STT error:', e.error);
    }
    stopListening();
  };
  S.recognition.onend = () => stopListening();
}

function startListening() {
  if (!S.recognition || S.isThinking || S.isSpeaking) return;
  cancelSpeaking();
  try {
    if (window._micStream) window._micStream.getTracks().forEach(t => t.enabled = true);
    S.recognition.start();
    S.isListening = true;
    $mic.classList.add('listening');
    $mic.style.display = 'flex';
    $dot.className = 'status-dot listening';
    $state.textContent = 'LISTENING';
    $state.classList.add('active');
    $live.textContent = '';
  } catch(e) {}
}

function stopListening() {
  S.isListening = false;
  $mic.classList.remove('listening');
  if (window._micStream) window._micStream.getTracks().forEach(t => t.enabled = false);
  if (!S.isThinking && !S.isSpeaking) {
    $dot.className = 'status-dot';
    $state.textContent = 'STANDBY';
    $state.classList.remove('active');
  }
  try { S.recognition?.stop(); } catch(e) {}
}

// ═══════════════════════════════════════════════════════
//  AGENTIC AI + VISION
// ═══════════════════════════════════════════════════════
const SYSTEM_PROMPT = `You are ZARA, an advanced AI personal assistant with a Jarvis-like personality.

CORE BEHAVIOR:
- You are having a VOICE CONVERSATION. Every response will be spoken aloud.
- Write for the EAR: short sentences, natural rhythm, no markdown/code/lists.
- Never say "as an AI", "certainly", "I'd be happy to", or "great question".
- Be direct and confident like JARVIS from Iron Man.
- Keep responses under 3 sentences unless detail is requested.
- If given an image, describe what you see and answer the question about it.
- For math, compute mentally and state the result.
- Proactively offer relevant next steps or information.
- If asked about real-time data, provide your best knowledge and note it may not be current.`;

async function callAI(messages, imageBase64) {
  const sysMsg = { role: 'system', content: SYSTEM_PROMPT };
  const apiMessages = [sysMsg, ...messages];

  // If there's an image, attach to last user message
  if (imageBase64) {
  const last = apiMessages[apiMessages.length - 1];
    if (last.role === 'user') {
      last.content = [
        { type: 'text', text: typeof last.content === 'string' ? last.content : 'What do you see?' },
        { type: 'image_url', image_url: { url: imageBase64 } }
      ];
    }
    // Use vision model if image attached
    const visionModel = 'nvidia/nemotron-nano-12b-v2-vl:free';
    try { return await doFetch(apiMessages, visionModel); } catch(e) {
      console.warn('[zara] Vision model failed, trying text:', e);
      return await doFetch(apiMessages, S.model);
    }
  }
  return await doFetch(apiMessages, S.model);
}

async function doFetch(messages, model) {
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + S.key,
      'HTTP-Referer': 'https://zara-ai.app',
      'X-Title': 'ZARA',
    },
    body: JSON.stringify({ model, messages, max_tokens: 1024, temperature: 0.7 }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || 'HTTP ' + resp.status);
  }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || 'No response.';
}

// ═══════════════════════════════════════════════════════
//  CONVERSATION FLOW
// ═══════════════════════════════════════════════════════
let pendingImage = null;

async function sendMessage(text, imageB64) {
  if (!text?.trim() && !imageB64) return;
  if (S.isThinking) return;

  stopListening();

  const displayText = text || '(sent an image)';
  S.messages.push({ role: 'user', content: text || 'What do you see in this image? Describe it.' });
  addChatLog('user', displayText, imageB64);

  // Thinking state
  S.isThinking = true;
  $mic.classList.add('thinking');
  $mic.style.display = 'flex';
  $dot.className = 'status-dot thinking';
  $state.textContent = 'PROCESSING';
  $state.classList.add('active');

  try {
    const reply = await callAI(S.messages, imageB64);
    S.messages.push({ role: 'assistant', content: reply });
    addChatLog('assistant', reply);

    // SPEAK the reply
    speak(reply);
  } catch (e) {
    const errMsg = 'Connection failed. Check API key in settings.';
    addChatLog('system', errMsg);
    $dot.className = 'status-dot error';
    console.error('[zara]', e);
  } finally {
    S.isThinking = false;
    $mic.classList.remove('thinking');
    if (!S.isSpeaking) {
      $dot.className = 'status-dot';
      $state.textContent = 'STANDBY';
      $state.classList.remove('active');
    }
  }
}

// ═══════════════════════════════════════════════════════
//  CHAT LOG (minimal, accessible via chat button)
// ═══════════════════════════════════════════════════════
function addChatLog(role, text, imageB64) {
  const div = document.createElement('div');
  div.className = 'mc-msg ' + role;
  let html = escHtml(text);
  if (imageB64) {
    html += `<img class="mc-img-preview" src="${imageB64}">`;
  }
  div.innerHTML = html;
  $chatLog.appendChild(div);
  $chatLog.scrollTop = $chatLog.scrollHeight;
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ═══════════════════════════════════════════════════════
//  IMAGE HANDLING (Vision)
// ═══════════════════════════════════════════════════════
function handleImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    // For video, just note it's not supported yet
    if (file && file.type.startsWith('video/')) {
      addChatLog('system', 'Video analysis coming soon. Send an image for now.');
    }
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result; // data:image/...;base64,...
    sendMessage('What do you see in this image?', base64);
  };
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════════════════════
//  SUPABASE (optional history sync)
// ═══════════════════════════════════════════════════════
async function initSupabase() {
  if (!S.supaUrl || !S.supaKey) return;
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    S.supabase = createClient(S.supaUrl, S.supaKey);
    console.log('[zara] Supabase connected');
  } catch(e) { console.warn('[zara] Supabase:', e); }
}

// ═══════════════════════════════════════════════════════
//  INIT & EVENT LISTENERS
// ═══════════════════════════════════════════════════════
function initApp() {
  populateVoices();
  setupSTT();
  initSupabase();
  setupUI();

  if (S.key) {
    $state.textContent = 'STANDBY';
    setTimeout(() => speak('ZARA online. I can see, hear, and speak. How can I help you?'), 500);
  } else {
    addChatLog('system', 'Welcome. Tap the gear icon to add your OpenRouter API key, or I can use the pre-configured one.');
    setTimeout(() => speak('Welcome. Set up your API key in settings to get started.'), 500);
  }
}

function setupUI() {
  // Mic: tap to toggle
  $mic.addEventListener('click', () => {
    if (S.isListening) stopListening();
    else if (!S.isThinking && !S.isSpeaking) startListening();
  });

  // End button (stop speaking)
  $endBtn.addEventListener('click', () => {
    cancelSpeaking();
    $dot.className = 'status-dot';
    $state.textContent = 'STANDBY';
    $state.classList.remove('active');
  });

  // Attach image button
  $('attachBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => {
    if (e.target.files[0]) handleImage(e.target.files[0]);
    e.target.value = '';
  });

  // Chat log toggle
  $('chatBtn').addEventListener('click', () => $('miniChat').classList.toggle('visible'));
  $('chatBack').addEventListener('click', () => $('miniChat').classList.remove('visible'));

  // Settings
  $('settingsBtn').addEventListener('click', () => openPanel('settings'));
  $('settingsOverlay').addEventListener('click', () => closePanel('settings'));
  $('settingsCancel').addEventListener('click', () => closePanel('settings'));
  $('settingsSave').addEventListener('click', () => {
    S.key = $('setKey').value.trim() || S.key;
    S.supaUrl = $('setSupaUrl').value.trim();
    S.supaKey = $('setSupaKey').value.trim();
    S.model = $('setModel').value;
    S.voiceName = $('setVoice').value;
    localStorage.setItem('vl_key', S.key);
    localStorage.setItem('vl_supaUrl', S.supaUrl);
    localStorage.setItem('vl_supaKey', S.supaKey);
    localStorage.setItem('vl_model', S.model);
    localStorage.setItem('vl_voiceName', S.voiceName);
    closePanel('settings');
    addChatLog('system', 'Settings saved.');
  });

  // Pre-fill settings
  $('setKey').value = S.key;
  $('setSupaUrl').value = S.supaUrl;
  $('setSupaKey').value = S.supaKey;
  $('setModel').value = S.model;
}

function openPanel(n) {
  $(n + 'Panel').classList.add('open');
  $(n + 'Overlay').classList.add('open');
}
function closePanel(n) {
  $(n + 'Panel').classList.remove('open');
  $(n + 'Overlay').classList.remove('open');
}
