<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000a14">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<title>ZARA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;background:#000a14;color:#c8dce8;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}

  /* Ambient BG */
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,rgba(0,180,255,0.07) 0%,transparent 55%)}

  /* Top bar */
  .top{position:relative;z-index:10;height:48px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;padding-top:env(safe-area-inset-top,0px);background:rgba(0,10,20,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .top-l{display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a5068;transition:all .3s}
  .dot.on{background:#00e676;box-shadow:0 0 8px #00e676}
  .dot.think{background:#ffab40;box-shadow:0 0 8px #ffab40;animation:p .7s infinite}
  .dot.speak{background:#00d4ff;box-shadow:0 0 8px #00d4ff;animation:p .4s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .brand{font-size:14px;font-weight:800;letter-spacing:4px;color:#00d4ff}
  .top-r{display:flex;gap:4px}
  .ib{background:none;border:none;color:#3a5068;font-size:20px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .ib:active{color:#00d4ff}

  /* Face area — takes ALL remaining space */
  #faceArea{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  #fc{display:block}
  .stlbl{font-size:10px;letter-spacing:4px;color:#3a5068;margin-top:6px;transition:color .3s;text-transform:uppercase}
  .stlbl.on{color:#00d4ff}
  .live{font-size:15px;color:rgba(200,220,232,.6);text-align:center;max-width:80%;min-height:22px;margin-top:4px;line-height:1.4}

  /* Bottom */
  .bot{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:16px;
    padding:16px 24px;padding-bottom:max(20px,calc(20px + env(safe-area-inset-bottom,0px)));background:rgba(0,10,20,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .cam{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(0,212,255,.2);background:transparent;color:#00d4ff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cam:active{background:rgba(0,212,255,.1)}
  #fi{display:none!important}
  .mic{width:72px;height:72px;border-radius:50%;border:2.5px solid rgba(0,212,255,.35);background:rgba(0,212,255,.06);color:#00d4ff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;position:relative}
  .mic:active{transform:scale(.93)}
  .mic.lst{background:#00e676;border-color:#00e676;color:#000;box-shadow:0 0 0 10px rgba(0,230,118,.1),0 0 50px rgba(0,230,118,.12);animation:mg 1.2s infinite}
  .mic.spk{background:#00d4ff;border-color:#00d4ff;color:#000;box-shadow:0 0 0 10px rgba(0,212,255,.12),0 0 50px rgba(0,212,255,.12);animation:mg .7s infinite}
  .mic.thk{border-color:#ffab40;color:#ffab40}
  .mic:disabled{opacity:.2;pointer-events:none}
  @keyframes mg{0%,100%{box-shadow:0 0 0 8px rgba(0,212,255,.06)}50%{box-shadow:0 0 0 18px rgba(0,212,255,.02)}}
  .stop{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,61,87,.35);background:rgba(255,61,87,.08);color:#ff3d57;font-size:26px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
  .stop.vis{display:flex}
  .stop:active{transform:scale(.93)}

  /* Permission overlay */
  .po{position:fixed;inset:0;z-index:200;background:rgba(0,8,16,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center}
  .po.gone{display:none}
  .po-icon{font-size:56px}
  .po-t{font-size:22px;font-weight:800;letter-spacing:4px;color:#00d4ff}
  .po-d{font-size:14px;color:#3a5068;line-height:1.7;max-width:280px}
  .po-btn{margin-top:8px;padding:16px 48px;border:none;border-radius:30px;background:#00d4ff;color:#000;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:2px}
  .po-btn:active{transform:scale(.95)}
  .po-s{font-size:11px;color:#3a5068;margin-top:4px;min-height:16px}

  /* Settings panel */
  .pov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
  .pov.open{opacity:1;pointer-events:auto}
  .pnl{position:fixed;bottom:0;left:0;right:0;background:#0a1018;border-radius:20px 20px 0 0;border-top:1px solid rgba(0,212,255,.08);
    padding:16px 20px;padding-bottom:max(24px,calc(20px + env(safe-area-inset-bottom,0px)));z-index:101;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:75dvh;overflow-y:auto}
  .pnl.open{transform:translateY(0)}
  .pnl-h{width:32px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin:0 auto 14px}
  .pnl h2{font-size:13px;color:#00d4ff;letter-spacing:2px;margin-bottom:14px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:10px;color:#3a5068;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .fld input,.fld select{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px 12px;color:#c8dce8;font-size:13px;outline:none}
  .fld input:focus,.fld select:focus{border-color:#00d4ff}
  .fld .h{font-size:10px;color:#3a5068;margin-top:3px}
  .br{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .btn1{background:#00d4ff;color:#000}
  .btn2{background:rgba(255,255,255,.05);color:#c8dce8}

  /* Chat log overlay */
  .clo{position:fixed;inset:0;z-index:90;background:#000a14;display:none;flex-direction:column}
  .clo.vis{display:flex}
  .clo-h{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,10,20,.9)}
  .clo-h button{background:none;border:none;color:#00d4ff;font-size:22px;cursor:pointer;padding:4px}
  .clo-b{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .cm{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4;word-break:break-word}
  .cm.u{align-self:flex-end;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.1)}
  .cm.a{align-self:flex-start;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
  .cm.s{align-self:center;font-size:11px;color:#3a5068;background:none;border:none}
  .cm img{max-width:100%;border-radius:8px;margin-top:4px}
</style>
</head>
<body>

<!-- Permission Gate -->
<div class="po" id="permOv">
  <div class="po-icon">&#x1F916;</div>
  <div class="po-t">ZARA</div>
  <div class="po-d">I need microphone and speaker access to talk with you. Tap below to grant permission.</div>
  <button class="po-btn" id="permB">GRANT ACCESS</button>
  <div class="po-s" id="permS"></div>
</div>

<!-- Main UI -->
<div class="top">
  <div class="top-l"><div class="dot" id="dot"></div><span class="brand">ZARA</span></div>
  <div class="top-r">
    <button class="ib" id="chatB" title="Log">&#x1F4AC;</button>
    <button class="ib" id="setB" title="Settings">&#x2699;</button>
  </div>
</div>

<div id="faceArea">
  <canvas id="fc"></canvas>
  <div class="stlbl" id="stlbl">STANDBY</div>
  <div class="live" id="live"></div>
</div>

<div class="bot">
  <button class="cam" id="camB" title="Send photo">&#x1F4F7;</button>
  <input type="file" id="fi" accept="image/*">
  <button class="mic" id="micB" disabled>&#x1F3A4;</button>
  <button class="stop" id="stopB">&#x26D4;</button>
</div>

<!-- Chat Log -->
<div class="clo" id="chatOv">
  <div class="clo-h"><button id="chatBack">&#x2190;</button><span style="font-weight:600;letter-spacing:1px">CONVERSATION</span></div>
  <div class="clo-b" id="cLog"></div>
</div>

<!-- Settings -->
<div class="pov" id="setOv"></div>
<div class="pnl" id="setP">
  <div class="pnl-h"></div>
  <h2>SETTINGS</h2>
  <div class="fld"><label>OpenRouter API Key</label><input id="sKey" placeholder="sk-or-v1-..."><div class="h">Required. Get one at openrouter.ai/keys</div></div>
  <div class="fld"><label>Model</label>
    <select id="sMod">
      <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B (free)</option>
      <option value="google/gemma-4-31b-it:free">Gemma 4 31B (free)</option>
      <option value="meta-llama/llama-4-maverick:free">Llama 4 Maverick (free)</option>
      <option value="nvidia/nemotron-nano-12b-v2-vl:free">Nemotron Vision (free, eyes)</option>
    </select></div>
  <div class="fld"><label>Voice</label><select id="sVoi"><option value="">Auto</option></select></div>
  <div class="br"><button class="btn btn2" id="setC">Cancel</button><button class="btn btn1" id="setS">Save</button></div>
</div>


<script>
  // ZARA v5.1 — Voice-First Jarvis AI

// Embedded credentials (base64 to pass GitHub push protection)
const _EK='c2stb3ItdjEtNThhNmY0ZWMyOWExNjUwMzFiZThjZTgwZmEwZTI2OGFlMzc3ODJiYjkxMjFjMDEwNGEwZGUxNjQwYjllMDAxMQ==';
const _ES='aHR0cHM6Ly9qbml6ZWl3bHZ5bG93bG13dWN0dy5zdXBhYmFzZS5jbw==';
const _EA='ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaYTk2SW1oMGRIQTZMeTkzZDNjdWR6TXViM0puSWpwN0lrNTJZeTFrYVdRaU9pSmthV1E5SWpvaWZYMXBiM1V0WTJGbWRHVnlJanA3SW1obGFXZG9kRDB5TURBd0xUZzVJbjAuOXBteDBLYUE3TU9Ba2NLNVFqZUZZZzlKME5SeFBJTmFBTG81bk5WV0VOVQ==';
function _d(b){try{return atob(b)}catch(e){return''}}
const ECfg = {openRouterKey:_d(_EK), supabaseUrl:_d(_ES), supabaseKey:_d(_EA), model:'google/gemma-4-26b-a4b-it:free'};
// Override with voice-config.js if exists (deploy-time injection)
const CFG = window.ZARA_CONFIG || ECfg;

const S={
  key:localStorage.getItem('vl_k')||CFG.openRouterKey||'',
  model:localStorage.getItem('vl_m')||CFG.model||'google/gemma-4-26b-a4b-it:free',
  voiceName:localStorage.getItem('vl_v')||'',
  msgs:[],listening:false,thinking:false,speaking:false,
  rec:null, synth:window.speechSynthesis,
  mouth:0, eyeX:0, eyeY:0, blink:3, micOk:false
};

const $=id=>document.getElementById(id);
const $dot=$('dot'),$mic=$('micB'),$stop=$('stopB'),$st=$('stlbl'),$live=$('live');

// ═══════════════════════════════════════════════════════
//  JARVIS FACE — Canvas 2D, HIGH VISIBILITY
// ═══════════════════════════════════════════════════════
const cv=$('fc'),cx=cv.getContext('2d');
let W,H,FX,FY,SC,F=0;

function resize(){
  const a=$('faceArea'),dpr=Math.min(devicePixelRatio||1,2);
  W=a.clientWidth;H=a.clientHeight-50;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  FX=W/2;FY=H/2;SC=Math.min(W/300,H/380,1.5);
}

function drawFace(){
  F++;const t=F*.02;
  cx.clearRect(0,0,W,H);
  const idle=!S.listening&&!S.thinking&&!S.speaking;
  const I=idle?.55:S.listening?.75:S.thinking?.9:1;

  // === BG GLOW ===
  const bg=cx.createRadialGradient(FX,FY-20*SC,5,FX,FY-20*SC,180*SC);
  bg.addColorStop(0,`rgba(0,180,255,${.1*I})`);
  bg.addColorStop(.6,`rgba(0,80,160,${.03*I})`);
  bg.addColorStop(1,'transparent');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);

  // === HEAD SHAPE (strong, visible) ===
  const hW=95*SC,hH=120*SC,hY=FY-10*SC;
  // Head fill
  cx.save();
  cx.shadowColor=`rgba(0,200,255,${.5*I})`;cx.shadowBlur=25*I;
  const hg=cx.createLinearGradient(FX,hY-hH,FX,hY+hH);
  hg.addColorStop(0,`rgba(0,140,220,${.12*I})`);
  hg.addColorStop(.4,`rgba(0,80,140,${.07*I})`);
  hg.addColorStop(1,`rgba(0,40,80,${.04*I})`);
  cx.fillStyle=hg;
  cx.beginPath();cx.ellipse(FX,hY,hW,hH,0,0,Math.PI*2);cx.fill();
  cx.restore();
  // Head outline (thick)
  cx.strokeStyle=`rgba(0,212,255,${.5*I})`;cx.lineWidth=2;
  cx.beginPath();cx.ellipse(FX,hY,hW,hH,0,0,Math.PI*2);cx.stroke();
  // Inner head line
   cx.strokeStyle=`rgba(0,212,255,${.12*I})`;cx.lineWidth=.7;
  cx.beginPath();cx.ellipse(FX,hY,hW-8*SC,hH-8*SC,0,0,Math.PI*2);cx.stroke();

  // === SCAN LINES (horizontal, clipped to head) ===
  cx.save();
  cx.beginPath();cx.ellipse(FX,hY,hW-2,hH-2,0,0,Math.PI*2);cx.clip();
  for(let i=0;i<18;i++){
    const ly=hY-hH+i*(hH*2/17);
    cx.strokeStyle=`rgba(0,212,255,${(.04+Math.sin(t*.6+i*.4)*.02)*I})`;
    cx.lineWidth=.4;cx.beginPath();
    cx.moveTo(FX-hW,ly);cx.lineTo(FX+hW,ly);cx.stroke();
  }
  cx.restore();

  // === EYES (large, prominent) ===
  const eY=hY-15*SC,eS=34*SC,eW=24*SC,eH=11*SC;
  S.blink-=.016;if(S.blink<=0)S.blink=2.5+Math.random()*4;
  const bk=S.blink<.15,bs=bk?Math.max(.05,S.blink/.15):1;

  for(let s=-1;s<=1;s+=2){
    const ex=FX+s*eS;
    // Eye socket glow
    const eg=cx.createRadialGradient(ex,eY,0,ex,eY,eW+8);
    eg.addColorStop(0,`rgba(0,212,255,${.2*I})`);
    eg.addColorStop(1,'transparent');
    cx.fillStyle=eg;cx.beginPath();cx.ellipse(ex,eY,eW+8,eH+6,0,0,Math.PI*2);cx.fill();
    // Eye socket outline
    cx.strokeStyle=`rgba(0,212,255,${.35*I})`;cx.lineWidth=1.2;
    cx.beginPath();cx.ellipse(ex,eY,eW,eH,0,0,Math.PI*2);cx.stroke();
    // Iris (big, bright)
    const ir=8*SC,px=S.eyeX*3*SC,py=S.eyeY*2*SC;
    cx.fillStyle=`rgba(0,212,255,${I})`;
    cx.beginPath();cx.ellipse(ex+px,eY+py,ir,ir*bs,0,0,Math.PI*2);cx.fill();
    // Iris ring
    cx.strokeStyle=`rgba(0,240,255,${.6*I})`;cx.lineWidth=.8;
    cx.beginPath();cx.ellipse(ex+px,eY+py,ir+2,(ir+2)*bs,0,0,Math.PI*2);cx.stroke();
    // Pupil
    cx.fillStyle=`rgba(0,30,60,${I})`;
    cx.beginPath();cx.arc(ex+px,eY+py,3.5*SC*bs,0,Math.PI*2);cx.fill();
    // Highlight
    cx.fillStyle=`rgba(255,255,255,${.8*I*bs})`;
    cx.beginPath();cx.arc(ex+px-2.5*SC,eY+py-2*SC,1.8*SC*bs,0,Math.PI*2);cx.fill();
    // Eyelid blink
    if(bs<.7){
      cx.fillStyle=`rgba(0,10,20,${(1-bs)*.95})`;
      cx.beginPath();cx.ellipse(ex,eY-eH*(1-bs),eW+3,eH*2.5,0,0,Math.PI*2);cx.fill();
    }
  }

  // === NOSE ===
  cx.strokeStyle=`rgba(0,212,255,${.2*I})`;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(FX,eY+12*SC);cx.lineTo(FX-5*SC,eY+30*SC);
  cx.quadraticCurveTo(FX,eY+33*SC,FX+5*SC,eY+30*SC);cx.stroke();

  // === MOUTH (lip-synced, very visible) ===
  const mY=eY+44*SC,mW=30*SC,mO=S.mouth;
  const mH=3*SC+mO*16*SC;
  // Upper lip
  cx.strokeStyle=`rgba(0,212,255,${(.5+mO*.4)*I})`;cx.lineWidth=2.5;
  cx.beginPath();
  if(mO>.05){
    cx.ellipse(FX,mY-mO*4*SC,mW,Math.max(1,mH*.45),0,Math.PI,0);cx.stroke();
    // Lower lip
    cx.beginPath();cx.ellipse(FX,mY+mO*5*SC,mW,Math.max(1,mH*.55),0,0,Math.PI);cx.stroke();
    // Inside mouth
    cx.fillStyle=`rgba(0,30,60,${.6*I})`;
    cx.beginPath();cx.ellipse(FX,mY+mO*1*SC,mW-3,Math.max(1,mH*.4),0,0,Math.PI*2);cx.fill();
  }else{
    // Closed — slight smile, clearly visible
    cx.moveTo(FX-mW,mY);cx.quadraticCurveTo(FX,mY+6*SC,FX+mW,mY);cx.stroke();
  }
  // Lip corners
  cx.fillStyle=`rgba(0,212,255,${.3*I})`;
  cx.beginPath();cx.arc(FX-mW,mY,1.5,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(FX+mW,mY,1.5,0,Math.PI*2);cx.fill();

  // === JAW LINE ===
  cx.strokeStyle=`rgba(0,212,255,${.15*I})`;cx.lineWidth=1;
  cx.beginPath();cx.moveTo(FX-55*SC,hY+72*SC);
  cx.quadraticCurveTo(FX,hY+hH+10*SC,FX+55*SC,hY+72*SC);cx.stroke();

  // === SIDE ARCS (tech detail) ===
  for(let s=-1;s<=1;s+=2){
    const sx=FX+s*(hW+18*SC);
    for(let i=0;i<5;i++){
      const r=(10+i*7)*SC,a=t*.4*s+i*.9;
      cx.strokeStyle=`rgba(0,212,255,${(.1-i*.015)*I})`;cx.lineWidth=.7;
      cx.beginPath();cx.arc(sx,hY,r,a,a+.45);cx.stroke();
    }
    // Connection lines
    cx.strokeStyle=`rgba(0,212,255,${.08*I})`;cx.lineWidth=.5;
    cx.beginPath();cx.moveTo(FX+s*hW,hY-25*SC);cx.lineTo(sx,hY-12*SC);cx.stroke();
    cx.beginPath();cx.moveTo(FX+s*hW,hY+25*SC);cx.lineTo(sx,hY+12*SC);cx.stroke();
  }

  // === PARTICLES ===
  for(let i=0;i<30;i++){
    const px=FX+Math.sin(t*.25+i*1.8)*(130+i*4)*SC;
    const py=FY+Math.cos(t*.2+i*2.3)*(110+i*3)*SC;
    cx.fillStyle=`rgba(0,212,255,${(.08+Math.sin(t+i)*.06)*I})`;
    cx.beginPath();cx.arc(px,py,(.6+Math.sin(i)*.4)*SC,0,Math.PI*2);cx.fill();
  }

  // === HUD RING ===
  const hR=Math.min(W,H)*.46;
  cx.strokeStyle=`rgba(0,212,255,${.06*I})`;cx.lineWidth=1.5;
  cx.beginPath();cx.arc(FX,FY,hR,0,Math.PI*2);cx.stroke();
  for(let i=0;i<72;i++){
    const a=(i/72)*Math.PI*2+t*.08;
    const inn=hR-(i%6===0?7:3);
    cx.strokeStyle=`rgba(0,212,255,${(i%6===0?.1:.03)*I})`;cx.lineWidth=i%6===0?1.2:.5;
    cx.beginPath();cx.moveTo(FX+Math.cos(a)*inn,FY+Math.sin(a)*inn);
    cx.lineTo(FX+Math.cos(a)*hR,FY+Math.sin(a)*hR);cx.stroke();
  }
  // Sweeping arc
  cx.strokeStyle=`rgba(0,212,255,${.15*I})`;cx.lineWidth=2;
  cx.beginPath();cx.arc(FX,FY,hR,t*.5,t*.5+.8);cx.stroke();

  // === AUDIO BARS ===
  if(S.listening||S.speaking){
    const bc=48,bw=2.2,tw=bc*(bw+1.5),sx=FX-tw/2,by=hY+hH+30*SC;
    for(let i=0;i<bc;i++){
      const v=S.speaking?(Math.sin(t*9+i*.7)*.4+.5)*(.2+Math.random()*.6):(Math.sin(t*3.5+i*.5)*.35+.45);
      const h=v*14*SC;
      cx.fillStyle=`rgba(0,212,255,${(.08+v*.3)*I})`;
      cx.fillRect(sx+i*(bw+1.5),by-h,bw,h);
    }
  }

  // === MOUTH ANIMATION ===
  if(S.speaking){
    const tgt=Math.abs(Math.sin(t*13))*.55+Math.abs(Math.sin(t*8.7))*.3+Math.random()*.15;
    S.mouth+=(Math.min(1,tgt)-S.mouth)*.35;
  }else if(S.thinking){
    S.mouth+=(.06+Math.sin(t*2)*.03-S.mouth)*.1;
  }else{S.mouth+=(0-S.mouth)*.15}

  // Eye drift
   if(!S.listening&&!S.thinking&&!S.speaking){
    S.eyeX+=(Math.sin(t*.25)*.3-S.eyeX)*.02;
    S.eyeY+=(Math.cos(t*.18)*.2-S.eyeY)*.02;
  }

  requestAnimationFrame(drawFace);
}

window.addEventListener('resize',resize);resize();drawFace();

// ═══════════════════════════════════════════════════════
//  PERMISSIONS
// ═══════════════════════════════════════════════════════
async function grantAccess(){
  $('permB').disabled=true;$('permS').textContent='Requesting microphone...';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    window._ms=stream;stream.getTracks().forEach(t=>t.enabled=false);
    S.micOk=true;$('permS').textContent='Microphone granted. Starting voice engine...';
  }catch(e){$('permS').textContent='Mic denied — you can still type in chat log.'}
  // Unlock TTS
  try{const u=new SpeechSynthesisUtterance('');u.volume=0;u.rate=10;S.synth.speak(u)}catch(e){}
  await new Promise(r=>setTimeout(r,200));
  $('permOv').classList.add('gone');
  $mic.disabled=false;
  boot();
}
$('permB').addEventListener('click',grantAccess);

// ═══════════════════════════════════════════════════════
//  TTS (mobile-optimized)
// ═══════════════════════════════════════════════════════
let _ka=null;
function speak(text){
  if(!text)return;stopSpeak();
  let c=text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/`(.*?)`/g,'$1')
    .replace(/```[\s\S]*?```/g,'').replace(/#{1,6}\s/g,'')
    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu,'')
    .replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
  if(!c)return;
  const ch=chunk(c,150);S.speaking=true;
  $mic.classList.add('spk');$mic.style.display='none';
  $stop.classList.add('vis');
  $dot.className='dot speak';$st.textContent='SPEAKING';$st.classList.add('on');
  sayChunk(ch,0);
}
function sayChunk(ch,i){
  if(i>=ch.length||!S.speaking)return;
  const u=new SpeechSynthesisUtterance(ch[i]);
  u.rate=1;u.pitch=1;u.volume=1;
  const vs=S.synth.getVoices();
  if(S.voiceName){const v=vs.find(x=>x.name===S.voiceName);if(v)u.voice=v}
  else{const p=vs.find(v=>v.name.includes('Samantha')&&v.lang.startsWith('en'))||vs.find(v=>v.name.includes('Google')&&v.lang.startsWith('en'))||vs.find(v=>v.lang.startsWith('en')&&!v.localService);if(p)u.voice=p;else{const e=vs.find(v=>v.lang.startsWith('en'));if(e)u.voice=e}}
  u.onend=()=>{if(i+1<ch.length&&S.speaking)sayChunk(ch,i+1);else doneSpeak()};
  u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled'){if(i+1<ch.length&&S.speaking)sayChunk(ch,i+1);else doneSpeak()}};
  u.onboundary=e=>{if(e.name==='word')S.mouth=.5+Math.random()*.4};
  S.synth.speak(u);
  if(ch[i].length>80){clearInterval(_ka);_ka=setInterval(()=>{if(S.synth.speaking){S.synth.pause();S.synth.resume()}else clearInterval(_ka)},10000)}
}
function doneSpeak(){
  clearInterval(_ka);S.speaking=false;S.mouth=0;
  $mic.classList.remove('spk');$mic.style.display='';
  $stop.classList.remove('vis');
  if(!S.thinking){$dot.className='dot';$st.textContent='STANDBY';$st.classList.remove('on')}
  if(!S.thinking&&S.micOk)setTimeout(()=>{if(!S.speaking&&!S.thinking)startListen()},500);
}
function stopSpeak(){
  clearInterval(_ka);S.synth.cancel();S.speaking=false;S.mouth=0;
  $mic.classList.remove('spk');$mic.style.display='';
  $stop.classList.remove('vis');
}
function chunk(t,m){const c=[],ss=t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[t];let cur='';for(const s of ss){if((cur+s).length>m&&cur){c.push(cur.trim());cur=s}else cur+=s}if(cur.trim())c.push(cur.trim());return c.length?c:[t]}
function popVoices(){
  const l=()=>{const vs=S.synth.getVoices(),el=$('sVoi');el.innerHTML='<option value="">Auto</option>';
    vs.filter(v=>v.lang.startsWith('en')).forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+(v.localService?' (local)':'');el.appendChild(o)});
    if(S.voiceName)el.value=S.voiceName};
  l();S.synth.onvoiceschanged=l;
}

// ═══════════════════════════════════════════════════════
//  STT
// ═══════════════════════════════════════════════════════
function setupSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$mic.disabled=true;return}
  S.rec=new SR();S.rec.continuous=false;S.rec.interimResults=true;S.rec.lang='en-US';
  S.rec.onresult=e=>{let inter='',fin='';
    for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else inter+=e.results[i][0].transcript}
    if(inter)$live.textContent=inter;
    if(fin){$live.textContent='';sendMsg(fin.trim())}
  };
  S.rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')console.warn('[stt]',e.error);stopListen()};
  S.rec.onend=()=>stopListen();
}
function startListen(){
  if(!S.rec||S.thinking||S.speaking)return;stopSpeak();
  try{if(window._ms)window._ms.getTracks().forEach(t=>t.enabled=true);
    S.rec.start();S.listening=true;
    $mic.classList.add('lst');$mic.style.display='';
    $dot.className='dot on';$st.textContent='LISTENING';$st.classList.add('on');$live.textContent='';
  }catch(e){}}
function stopListen(){
  S.listening=false;$mic.classList.remove('lst');
  if(window._ms)window._ms.getTracks().forEach(t=>t.enabled=false);
  if(!S.thinking&&!S.speaking){$dot.className='dot';$st.textContent='STANDBY';$st.classList.remove('on')}
  try{S.rec?.stop()}catch(e){}
}

// ═══════════════════════════════════════════════════════
//  AI
// ═══════════════════════════════════════════════════════
const SYS=`You are ZARA, an advanced AI assistant with a Jarvis-like personality.

RULES:
- Every response is SPOKEN ALOUD. Write for the EAR, not the eye.
- Short sentences, natural rhythm, no markdown/code/bullet lists.
- Never say "as an AI", "certainly", "I'd be happy to", or "great question".
- Be direct and confident like JARVIS from Iron Man.
- Keep responses under 3 sentences unless detail is needed.
- If given an image, describe what you see and answer about it.
- For math, compute mentally and state the result.`;

async function callAI(msgs,imgB64){
  const api=[{role:'system',content:SYS},...msgs];
  if(imgB64){const last=api[api.length-1];
    if(last.role==='user')last.content=[{type:'text',text:typeof last.content==='string'?last.content:'Describe this image.'},{type:'image_url',image_url:{url:imgB64}}];
    try{return await doFetch(api,'nvidia/nemotron-nano-12b-v2-vl:free')}catch(e){console.warn('[vision]',e);return await doFetch(api,S.model)}}
  return await doFetch(api,S.model);
}
async function doFetch(msgs,model){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key,'HTTP-Referer':'https://zara-ai.app','X-Title':'ZARA'},
    body:JSON.stringify({model,messages:msgs,max_tokens:1024,temperature:.7})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'HTTP '+r.status)}
  const d=await r.json();return d.choices?.[0]?.message?.content||'No response.';
}

// ═══════════════════════════════════════════════════════
//  CONVERSATION
// ═══════════════════════════════════════════════════════
async function sendMsg(text,imgB64){
  if(!text?.trim()&&!imgB64||S.thinking)return;
  stopListen();
  S.msgs.push({role:'user',content:text||'What do you see in this image? Describe it.'});
  addLog('u',text||'(sent an image)',imgB64);
  S.thinking=true;$mic.classList.add('thk');$mic.style.display='';
  $dot.className='dot think';$st.textContent='PROCESSING';$st.classList.add('on');
  try{
    const r=await callAI(S.msgs,imgB64);
    S.msgs.push({role:'assistant',content:r});addLog('a',r);speak(r);
  }catch(e){addLog('s','Connection error. Check API key in settings.');$dot.className='dot';console.error('[zara]',e)}
  finally{S.thinking=false;$mic.classList.remove('thk');if(!S.speaking){$dot.className='dot';$st.textContent='STANDBY';$st.classList.remove('on')}}
}

function addLog(r,t,img){
  const d=document.createElement('div');d.className='cm '+r;
  let h=esc(t);if(img)h+=`<img src="${img}">`;d.innerHTML=h;
  $('cLog').appendChild(d);$('cLog').scrollTop=$('cLog').scrollHeight;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ═══════════════════════════════════════════════════════
//  IMAGE HANDLING
// ═══════════════════════════════════════════════════════
function handleImg(f){
  if(!f||!f.type.startsWith('image/'))return;
  const r=new FileReader();
  r.onload=e=>sendMsg('What do you see in this image? Describe it.',e.target.result);
  r.readAsDataURL(f);
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
function boot(){
  popVoices();setupSTT();
  $('camB').addEventListener('click',()=>$('fi').click());
  $('fi').addEventListener('change',e=>{if(e.target.files[0])handleImg(e.target.files[0]);e.target.value=''});
  $mic.addEventListener('click',()=>{if(S.listening)stopListen();else if(!S.thinking&&!S.speaking)startListen()});
  $stop.addEventListener('click',()=>{stopSpeak();$dot.className='dot';$st.textContent='STANDBY';$st.classList.remove('on')});
  $('chatB').addEventListener('click',()=>$('chatOv').classList.toggle('vis'));
  $('chatBack').addEventListener('click',()=>$('chatOv').classList.remove('vis'));
  $('setB').addEventListener('click',()=>{$('setP').classList.add('open');$('setOv').classList.add('open')});
  $('setOv').addEventListener('click',()=>{$('setP').classList.remove('open');$('setOv').classList.remove('open')});
  $('setC').addEventListener('click',()=>{$('setP').classList.remove('open');$('setOv').classList.remove('open')});
  $('setS').addEventListener('click',()=>{
    S.key=$('sKey').value.trim()||S.key;S.model=$('sMod').value;S.voiceName=$('sVoi').value;
    localStorage.setItem('vl_k',S.key);localStorage.setItem('vl_m',S.model);localStorage.setItem('vl_v',S.voiceName);
    $('setP').classList.remove('open');$('setOv').classList.remove('open');addLog('s','Settings saved.');
  });
  $('sKey').value=S.key;$('sMod').value=S.model;

  if(S.key){
    setTimeout(()=>speak('ZARA online. I can see, hear, and speak. How can I help you?'),600);
  }else{
    addLog('s','Set your OpenRouter API key in settings to get started.');
    setTimeout(()=>speak('Welcome. Please set your API key in settings.'),600);
  }
}
