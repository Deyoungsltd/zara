<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Voice Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a}
canvas{display:block;width:100vw;height:100vh}
#tag{position:fixed;top:14px;right:18px;color:rgba(0,240,255,.55);font:11px/1 'Courier New',monospace;letter-spacing:2px;text-transform:uppercase;pointer-events:none;z-index:10;text-shadow:0 0 6px rgba(0,240,255,.3)}
#fps{position:fixed;top:14px;left:18px;color:rgba(0,240,255,.45);font:11px/1 'Courier New',monospace;pointer-events:none;z-index:10;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">IDLE</div>
<div id="fps">-- FPS</div>
<script>
'use strict';

/* ==============================================================
   UTILITIES
   ============================================================== */
const lerp  = (a,b,t) => a + (b - a) * t;
const clamp = (v,lo,hi) => v < lo ? lo : v > hi ? hi : v;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutQuad = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

function hexRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ==============================================================
   CONFIGURATION
   ============================================================== */
const COL = {
  bg1:'#060612', bg2:'#0a0a1a', bg3:'#0e0e28', bg4:'#12122e',
  building:'#1a1a2e', buildingFar:'#0f0f20',
  cyan:'#00f0ff', magenta:'#ff00aa', orange:'#ff6600',
  warmWin:'#ffcc00', coolWin:'#aaddff',
  rain:'rgba(140,180,220,',
  alertRed:'#ff2200'
};
const STALE_MS    = 2000;
const POLL_MS     = 100;
const BOOT_MS     = 2200;
const RAIN_MAX    = 400;
const NUM_EQ      = 52;
const DATARAIN_SPACING = 20;

/* ==============================================================
   GLOBALS
   ============================================================== */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const tagEl  = document.getElementById('tag');
const fpsEl  = document.getElementById('fps');

let W = 0, H = 0, DPR = 1;
let groundY = 0, roadH = 0;
let offCanvas, offCtx;

// State
let currentState  = 'idle';
let isAlert       = false;
let targetLevel   = 0;
let energyLevel   = 0;
let glowEnergy    = 0;
let motionEnergy  = 0;
let lastServerTS  = 0;
let useMock       = false;
let mockState     = null;
let shotMode      = null;

// Scene data
let farBuildings  = [];
let nearBuildings = [];
let allWindows    = [];
let neonSigns     = [];
let stars         = [];
let rainDrops     = [];
let dataRainCols  = [];
let eqValues      = new Float32Array(NUM_EQ);
let eqTargets     = new Float32Array(NUM_EQ);

// Boot
let bootStart = 0;

// FPS
let fpsShow    = false;
let frameTimes = [];
let rafId      = 0;
let startTime  = 0;

/* ==============================================================
   URL PARAMS
   ============================================================== */
(function parseParams(){
  const p = new URLSearchParams(location.search);
  if(p.has('mockstate')){ mockState = p.get('mockstate'); useMock = true; }
  if(p.has('shot')){
    shotMode = { state: p.get('shot'), time: parseInt(p.get('t'))||1500 };
    mockState = shotMode.state; useMock = true;
  }
})();

/* ==============================================================
   CANVAS SETUP
   ============================================================== */
function setupCanvas(){
  const raw = window.devicePixelRatio || 1;
  DPR = Math.min(raw, 1.25);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  groundY = H * 0.85;
  roadH   = H * 0.15;

  offCanvas = document.createElement('canvas');
  offCanvas.width  = W * DPR;
  offCanvas.height = H * DPR;
  offCtx = offCanvas.getContext('2d');
  offCtx.setTransform(DPR,0,0,DPR,0,0);
}

/* ==============================================================
   SCENE GENERATION
   ============================================================== */
function seededRand(seed){
  let s = seed;
  return function(){ s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

function generateScene(){
  const rng = seededRand(42);

  // --- Far buildings ---
  farBuildings = [];
  let x = -40;
  while(x < W + 40){
    const w = 25 + rng() * 65;
    const h = groundY * (0.12 + rng() * 0.35);
    farBuildings.push({ x, w, h, y: groundY - h });
    x += w + rng() * 6;
  }

  // --- Near buildings ---
  nearBuildings = [];
  x = -20;
  while(x < W + 20){
    const w = 38 + rng() * 115;
    const h = groundY * (0.22 + rng() * 0.72);
    const gap = rng() * 14;
    const hasAntenna = rng() > 0.85 && h > groundY * 0.5;
    const hasRooftop = rng() > 0.6;
    const rooftopW = w * (0.3 + rng() * 0.4);
    const rooftopH = 6 + rng() * 14;
    nearBuildings.push({ x, w, h, y: groundY - h, gap, hasAntenna, hasRooftop, rooftopW, rooftopH });
    x += w + gap;
  }

  // --- Windows ---
  allWindows = [];
  for(const b of nearBuildings){
    const ww = 3, wh = 5, sx = 8, sy = 9, mx = 7, my = 10;
    for(let wy = b.y + my; wy < groundY - wh - 2; wy += sy){
      for(let wx = b.x + mx; wx < b.x + b.w - ww - mx; wx += sx){
        if(rng() > 0.32){
          allWindows.push({
            x: wx, y: wy, w: ww, h: wh,
            lit: rng() > 0.22,
            warm: rng() > 0.45,
            fSpd: 0.4 + rng() * 4,
            fPh: rng() * Math.PI * 2
          });
        }
      }
    }
  }

  // --- Neon signs ---
  neonSigns = [];
  const neonColors = [COL.cyan, COL.magenta, COL.orange, '#00ff88', COL.cyan, COL.magenta];
  const cands = nearBuildings.filter(b => b.w > 48 && b.h > 90);
  for(let i = 0; i < Math.min(6, cands.length); i++){
    const b = cands[i];
    const sw = 14 + rng() * (b.w * 0.35);
    const sh = 5 + rng() * 12;
    const sx2 = b.x + (b.w - sw) * (0.2 + rng() * 0.6);
    const sy2 = b.y + 14 + rng() * (b.h * 0.3);
    neonSigns.push({
      x: sx2, y: sy2, w: sw, h: sh,
      color: neonColors[i % neonColors.length],
      fSpd: 0.8 + rng() * 2.5,
      fPh: rng() * Math.PI * 2
    });
  }

  // --- Stars ---
  stars = [];
  for(let i = 0; i < 80; i++){
    stars.push({
      x: rng() * W, y: rng() * groundY * 0.55,
      r: 0.3 + rng() * 1.1,
      a: 0.15 + rng() * 0.45,
      tSpd: 0.4 + rng() * 1.8,
      tPh: rng() * Math.PI * 2
    });
  }

  // --- Rain pool ---
  rainDrops = [];
  for(let i = 0; i < RAIN_MAX; i++) rainDrops.push(makeRainDrop(rng));

  // --- Data rain columns ---
  dataRainCols = [];
  const numDC = Math.floor(W / DATARAIN_SPACING);
  const glyphs = '0123456789ABCDEF<>{}[]|=+/\\@#$%';
  for(let i = 0; i < numDC; i++){
    const col = {
      x: i * DATARAIN_SPACING + rng() * 8,
      y: rng() * H * 2 - H,
      speed: 60 + rng() * 180,
      trail: 7 + Math.floor(rng() * 14),
      fs: 9 + Math.floor(rng() * 3),
      chars: []
    };
    for(let j = 0; j < col.trail; j++) col.chars.push(glyphs[Math.floor(rng()*glyphs.length)]);
    dataRainCols.push(col);
  }

  // --- EQ ---
  eqValues.fill(0);
  eqTargets.fill(0);
}

function makeRainDrop(rng){
  return {
    x: Math.random() * (W + 200) - 100,
    y: Math.random() * H * 1.3 - H * 0.3,
    vy: 3 + (rng ? rng() : Math.random()) * 8,
    vx: 0,
    len: 8 + (rng ? rng() : Math.random()) * 22,
    a: 0.06 + (rng ? rng() : Math.random()) * 0.22,
    th: 0.4 + (rng ? rng() : Math.random()) * 1.1
  };
}

/* ==============================================================
   OFFSCREEN BAKING
   ============================================================== */
function bakeOffscreen(){
  const c = offCtx;
  c.clearRect(0, 0, W, H);

  // Far buildings
  c.fillStyle = COL.buildingFar;
  for(const b of farBuildings) c.fillRect(b.x, b.y, b.w, b.h);

  // Near buildings with rooftop details
  for(const b of nearBuildings){
    // Main body
    c.fillStyle = COL.building;
    c.fillRect(b.x, b.y, b.w, b.h);

    // Subtle vertical edge highlight
    c.fillStyle = 'rgba(40,40,70,0.4)';
    c.fillRect(b.x, b.y, 2, b.h);
    c.fillRect(b.x + b.w - 2, b.y, 2, b.h);

    // Rooftop structure
    if(b.hasRooftop){
      const rx = b.x + (b.w - b.rooftopW) / 2;
      c.fillStyle = '#151528';
      c.fillRect(rx, b.y - b.rooftopH, b.rooftopW, b.rooftopH);
      c.fillStyle = 'rgba(40,40,70,0.3)';
      c.fillRect(rx, b.y - b.rooftopH, b.rooftopW, 1.5);
    }

    // Antenna
    if(b.hasAntenna){
      const ax = b.x + b.w / 2;
      c.strokeStyle = '#2a2a45';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(ax, b.y); c.lineTo(ax, b.y - 28); c.stroke();
    }
  }
}

/* ==============================================================
   STATE MANAGEMENT
   ============================================================== */
let pollTimer = null;

function startPolling(){
  if(useMock) return;
  pollTimer = setInterval(fetchState, POLL_MS);
  fetchState();
}

async function fetchState(){
  try {
    const r = await fetch('/state');
    if(!r.ok) return;
    const d = await r.json();
    lastServerTS = performance.now();
    currentState = d.state || 'idle';
    targetLevel  = clamp(d.level ?? 0, 0, 1);
    isAlert      = !!d.alert;
  } catch(e){ /* handled by staleness */ }
}

function getMockLevel(st, t){
  switch(st){
    case 'idle':     return 0.03 + 0.04 * Math.sin(t*0.5);
    case 'listening':return 0.15 + 0.15*Math.sin(t*2) + 0.08*Math.sin(t*5.3);
    case 'thinking': return 0.32 + 0.13*Math.sin(t*3) + 0.08*(Math.sin(t*7)*0.5+0.5);
    case 'speaking':{
      const base = 0.35 + 0.35*(Math.sin(t*4.2)*0.3+Math.sin(t*7.5)*0.3+Math.sin(t*11.3)*0.2);
      return clamp(base + (Math.random()-0.5)*0.15, 0.1, 1);
    }
    case 'alert':    return 0.55 + 0.45*Math.abs(Math.sin(t*6));
    default:         return 0.05;
  }
}

function updateState(now, dt){
  if(useMock){
    lastServerTS = now;
    const ms = mockState || 'idle';
    if(ms === 'alert'){ isAlert = true; currentState = 'speaking'; }
    else { isAlert = false; currentState = ms; }
    targetLevel = getMockLevel(currentState, now * 0.001);
  } else {
    // Staleness check
    if(now - lastServerTS > STALE_MS){
      targetLevel = lerp(targetLevel, 0, 0.03);
      if(energyLevel < 0.02) currentState = 'idle';
      isAlert = false;
    }
  }

  // Smooth energy axes
  energyLevel  = lerp(energyLevel,  targetLevel, 0.12);
  glowEnergy   = lerp(glowEnergy,   energyLevel, 0.04);
  motionEnergy = lerp(motionEnergy,  energyLevel, 0.16);

  // Idle breathing
  if(currentState === 'idle' && !isAlert){
    const breathe = 0.02 + 0.03 * Math.sin(now * 0.001 * 0.5);
    targetLevel = Math.max(targetLevel, breathe);
  }
}

/* ==============================================================
   DRAWING: BACKGROUND & STARS
   ============================================================== */
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,   COL.bg1);
  g.addColorStop(0.4, COL.bg2);
  g.addColorStop(0.8, COL.bg3);
  g.addColorStop(1,   COL.bg4);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, groundY);
}

function drawStars(t, boot){
  const a = boot * (1 - glowEnergy * 0.7);
 if(a < 0.01) return;
  for(const s of stars){
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.tSpd + s.tPh);
    ctx.globalAlpha = s.a * twinkle * a;
    ctx.fillStyle = '#c8d8ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ==============================================================
   DRAWING: BUILDINGS (from offscreen)
   ============================================================== */
function drawFarBuildings(boot){
  ctx.globalAlpha = boot;
  for(const b of farBuildings){
    ctx.fillStyle = COL.buildingFar;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  }
  ctx.globalAlpha = 1;
}

function drawNearBuildings(boot){
  ctx.globalAlpha = boot;
  ctx.drawImage(offCanvas, 0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* ==============================================================
   DRAWING: ATMOSPHERE
   ============================================================== */
function drawAtmosphere(){
  const g = ctx.createLinearGradient(0, groundY*0.3, 0, groundY);
  g.addColorStop(0, 'rgba(10,10,30,0)');
  g.addColorStop(0.6, 'rgba(14,14,40,0.25)');
  g.addColorStop(1, 'rgba(18,18,50,0.45)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, groundY);
}

/* ==============================================================
   DRAWING: WINDOWS
   ============================================================== */
function drawWindows(t, state, boot){
  const baseFlicker = state === 'thinking' ? 0.2 : state === 'alert' ? 0.35 : 0.02;
  const brightMult  = state === 'listening' ? 1.3 : state === 'thinking' ? 1.5 : state === 'speaking' ? 1.4 : state === 'alert' ? 1.8 : 1.0;
  const tSec = t * 0.001;

  ctx.globalAlpha = boot;
  for(const win of allWindows){
    if(!win.lit) continue;
    const flicker = Math.sin(tSec * win.fSpd + win.fPh);
    const shouldFlicker = Math.random() < baseFlicker;
    if(shouldFlicker && flicker < -0.3) continue;

    const brightness = clamp(0.5 + flicker * 0.3, 0.3, 1.0) * brightMult;
    const col = win.warm ? COL.warmWin : COL.coolWin;
    ctx.fillStyle = hexRgba(col, clamp(brightness, 0, 1) * 0.85);
    ctx.fillRect(win.x, win.y, win.w, win.h);
  }
  ctx.globalAlpha = 1;
}

/* ==============================================================
   DRAWING: NEON SIGNS
   ============================================================== */
function drawNeonSigns(t, state, boot){
  const pulse = glowEnergy;
  const tSec = t * 0.001;
  const alertFlash = isAlert ? (Math.sin(tSec * 12) > 0 ? 1.5 : 0.3) : 1;

  ctx.globalAlpha = clamp((boot - 0.4) / 0.3, 0, 1);

  for(const s of neonSigns){
    const flicker = 0.7 + 0.3 * Math.sin(tSec * s.fSpd + s.fPh);
    const intensity = (0.3 + pulse * 0.7) * flicker * alertFlash;
    if(intensity < 0.05) continue;

    ctx.save();
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 12 + pulse * 22;
    ctx.fillStyle = hexRgba(s.color, clamp(intensity, 0, 1));
    ctx.fillRect(s.x, s.y, s.w, s.h);
    // Double draw for stronger glow
    ctx.globalAlpha *= 0.5;
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.restore();
    ctx.globalAlpha = clamp((boot - 0.4) / 0.3, 0, 1);
  }
  ctx.globalAlpha = 1;
}

/* ==============================================================
   DRAWING: ANTENNA BLINK
   ============================================================== */
function drawAntennaBlink(t){
  const tSec = t * 0.001;
  const blink = Math.sin(tSec * 1.5) > 0.7;
  if(!blink) return;
  for(const b of nearBuildings){
    if(!b.hasAntenna) continue;
    const ax = b.x + b.w / 2;
    const ay = b.y - 28;
    ctx.save();
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,34,0,0.9)';
    ctx.beginPath(); ctx.arc(ax, ay, 2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ==============================================================
   DRAWING: WAVEFORM
   ============================================================== */
function drawWaveform(t, boot){
  const baseY = groundY * 0.32;
  const maxAmp = 15 + glowEnergy * 65;
  const tSec = t * 0.001;

  const alpha = (0.12 + glowEnergy * 0.55) * boot;
  if(alpha < 0.01) return;

  for(let layer = 0; layer < 3; layer++){
    const la = alpha * (1 - layer * 0.3);
    const amp = maxAmp * (1 - layer * 0.15);
    const spd = (2 + layer * 0.7) * (1 + motionEnergy * 1.8);
    const freq = 0.006 + layer * 0.003;

    ctx.save();
    ctx.strokeStyle = layer === 2
      ? hexRgba(COL.magenta, la * 0.6)
      : hexRgba(COL.cyan, la);
    ctx.lineWidth = 1.8 - layer * 0.4;
    if(layer === 0){
      ctx.shadowColor = COL.cyan;
      ctx.shadowBlur = 8 + glowEnergy * 16;
    } else if(layer === 2){
      ctx.shadowColor = COL.magenta;
      ctx.shadowBlur = 6 + glowEnergy * 10;
    }

    ctx.beginPath();
    for(let x = 0; x <= W; x += 3){
      const wave =
        Math.sin(x * freq + tSec * spd) * 0.5 +
        Math.sin(x * freq * 2.1 + tSec * spd * 1.4) * 0.3 +
        Math.sin(x * freq * 0.6 + tSec * spd * 0.6) * 0.2;
      const envelope = Math.sin(x / W * Math.PI);
      const y = baseY + wave * amp * envelope;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ==============================================================
   DRAWING: EQUALIZER BARS
   ============================================================== */
function drawEqualizer(t, dt, boot){
  if(currentState !== 'speaking' || boot < 0.8) return;
  const alpha = clamp((boot - 0.8) / 0.2, 0, 1);
  const tSec = t * 0.001;
  const barW = (W / NUM_EQ) - 2;
  const maxH = groundY * 0.45;

  // Update targets
  for(let i = 0; i < NUM_EQ; i++){
    const f = (i+1)/NUM_EQ;
    const n =
      Math.sin(tSec*4 + i*0.8)*0.3 +
      Math.sin(tSec*7.3 + i*1.5)*0.2 +
      Math.sin(tSec*11.1 + i*2.3)*0.12 +
      (Math.random()-0.5)*0.15;
    eqTargets[i] = clamp(0.5 + n, 0, 1) * motionEnergy;
    eqValues[i] = lerp(eqValues[i], eqTargets[i], 0.28);
  }

  // Gradient (single, for all bars)
  const g = ctx.createLinearGradient(0, groundY, 0, groundY - maxH);
  g.addColorStop(0, hexRgba(COL.cyan, 0.75 * alpha));
  g.addColorStop(0.45, hexRgba(COL.magenta, 0.55 * alpha));
  g.addColorStop(1, hexRgba(COL.orange, 0.35 * alpha));

  ctx.save();
  ctx.shadowColor = COL.cyan;
  ctx.shadowBlur = 6 + glowEnergy * 10;
  ctx.fillStyle = g;

  for(let i = 0; i < NUM_EQ; i++){
    const bh = eqValues[i] * maxH;
    if(bh < 1) continue;
    const bx = i * (barW + 2) + 1;
    ctx.fillRect(bx, groundY - bh, barW, bh);
  }

  // Bright caps
  ctx.shadowBlur = 0;
  ctx.fillStyle = `rgba(255,255,255,${0.7 * alpha})`;
  for(let i = 0; i < NUM_EQ; i++){
    const bh = eqValues[i] * maxH;
    if(bh < 3) continue;
    ctx.fillRect(i * (barW + 2) + 1, groundY - bh, barW, 2);
  }
  ctx.restore();
}

/* ==============================================================
   DRAWING: DATA RAIN (thinking)
   ============================================================== */
const DATA_CHARS = '0123456789ABCDEFabcdef{}[]|<>/@#$%&*';

function drawDataRain(t, dt, boot){
  const st = isAlert ? 'alert' : currentState;
  if(st !== 'thinking' || boot < 0.6) return;
  const alpha = clamp((boot - 0.6) / 0.3, 0, 1) * clamp(motionEnergy * 2, 0, 1);
  if(alpha < 0.01) return;

  ctx.save();
  ctx.font = '11px monospace';
  ctx.textBaseline = 'top';

  for(const col of dataRainCols){
    col.y += col.speed * dt;
    if(col.y - col.trail * col.fs > groundY){
      col.y = -col.trail * col.fs - Math.random() * H * 0.5;
    }

    for(let j = 0; j < col.trail; j++){
      const cy = col.y - j * col.fs;
      if(cy < -20 || cy > groundY) continue;
      const fade = 1 - j / col.trail;
      if(j === col.trail - 1){
        // Head character - brighter
        ctx.fillStyle = hexRgba(COL.cyan, alpha * 0.95);
        ctx.shadowColor = COL.cyan;
        ctx.shadowBlur = 6;
      } else {
        ctx.fillStyle = `rgba(0,240,200,${alpha * fade * 0.5})`;
        ctx.shadowBlur = 0;
      }
      // Randomly mutate character
      if(Math.random() < 0.03) col.chars[j] = DATA_CHARS[Math.floor(Math.random()*DATA_CHARS.length)];
      ctx.fillText(col.chars[j], col.x, cy);
    }
  }
  ctx.restore();
}

/* ==============================================================
   DRAWING: RAIN
   ============================================================== */
function getRainCount(st){
  switch(st){
    case 'idle':      return 70;
    case 'listening': return 140;
    case 'thinking':  return 120;
    case 'speaking':  return 340;
    case 'alert':     return 240;
    default:          return 80;
  }
}

function drawRain(t, dt, boot){
  const st = isAlert ? 'alert' : currentState;
  const count = getRainCount(st);
  const intensity = count / RAIN_MAX;
  const speedMult = st === 'speaking' ? 2.0 : st === 'alert' ? 1.8 : st === 'listening' ? 1.3 : 1.0;
  const windX = st === 'speaking' ? 3.5 * motionEnergy : st === 'alert' ? 1.5 : 0;
  const bootA = clamp((boot - 0.5) / 0.3, 0, 1);
  const alpha = bootA;
  if(alpha < 0.01) return;

  ctx.strokeStyle = COL.rain;
  for(let i = 0; i < Math.min(count, rainDrops.length); i++){
    const d = rainDrops[i];
    d.y += d.vy * speedMult * dt * 60;
    d.x += (d.vx + windX) * dt * 60;

    if(d.y > H + 20 || d.x > W + 100 || d.x < -100){
      d.y = -d.len - Math.random() * H * 0.3;
      d.x = Math.random() * (W + 200) - 100;
    }

    const endX = d.x + windX * d.len * 0.15;
    const endY = d.y + d.len;
    ctx.globalAlpha = d.a * alpha * intensity;
    ctx.lineWidth = d.th;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ==============================================================
   DRAWING: WET ROAD & REFLECTIONS
   ============================================================== */
function drawWetRoad(boot){
  // Road surface
  const g = ctx.createLinearGradient(0, groundY, 0, H);
  g.addColorStop(0, '#0c0c1e');
  g.addColorStop(0.15, '#0a0a18');
  g.addColorStop(1, '#080812');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY, W, roadH);

  // Subtle horizontal sheen line
  ctx.strokeStyle = 'rgba(80,100,140,0.06)';
  ctx.lineWidth = 1;
  for(let y = groundY + 3; y < H; y += 4){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawReflections(t, boot){
  if(boot < 0.6) return;
  const rAlpha = clamp((boot - 0.6) / 0.3, 0, 1) * (0.3 + glowEnergy * 0.4);
  const tSec = t * 0.001;

  for(const s of neonSigns){
    const pulse = 0.6 + 0.4 * Math.sin(tSec * s.fSpd + s.fPh);
    const a = rAlpha * pulse;
    if(a < 0.01) continue;

    // Vertical color streak on road
    const rx = s.x - 4;
    const rw = s.w + 8;
    const rh = roadH * 0.7;
    const g = ctx.createLinearGradient(0, groundY, 0, groundY + rh);
    g.addColorStop(0, hexRgba(s.color, a * 0.5));
    g.addColorStop(0.3, hexRgba(s.color, a * 0.25));
    g.addColorStop(1, hexRgba(s.color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(rx, groundY, rw, rh);
  }

  // General city glow on road
  const cg = ctx.createLinearGradient(0, groundY, 0, groundY + roadH * 0.4);
  const cityGlowA = (0.04 + glowEnergy * 0.06) * rAlpha;
  cg.addColorStop(0, `rgba(0,200,255,${cityGlowA})`);
  cg.addColorStop(1, 'rgba(0,200,255,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, groundY, W, roadH * 0.4);
}

/* ==============================================================
   DRAWING: SCAN LINE (listening)
   ============================================================== */
function drawScanLine(t, boot){
  const st = isAlert ? 'alert' : currentState;
  if(st !== 'listening') return;
  const tSec = t * 0.001;
  const alpha = boot * (0.15 + motionEnergy * 0.25);

  const period = 3.0; // seconds per sweep
  const progress = (tSec % period) / period;
  const y = progress * groundY;

  const g = ctx.createLinearGradient(0, y - 30, 0, y + 30);
  g.addColorStop(0, 'rgba(0,240,255,0)');
  g.addColorStop(0.5, `rgba(0,240,255,${alpha})`);
  g.addColorStop(1, 'rgba(0,240,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, y - 30, W, 60);
}

/* ==============================================================
   DRAWING: ALERT OVERLAY
   ============================================================== */
function drawAlertOverlay(t, boot){
  if(!isAlert) return;
  const tSec = t * 0.001;
  const pulse = 0.5 + 0.5 * Math.sin(tSec * 8);
  const a = pulse * 0.12 * boot;

  ctx.fillStyle = `rgba(255,34,0,${a})`;
  ctx.fillRect(0, 0, W, H);

  // Red vignette
  const vg = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.75);
  vg.addColorStop(0, 'rgba(255,34,0,0)');
  vg.addColorStop(1, `rgba(255,34,0,${a * 1.5})`);
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ==============================================================
   DRAWING: SCENE GLOW
   ============================================================== */
function drawSceneGlow(boot){
  if(glowEnergy < 0.03) return;
  const cx = W / 2;
  const cy = groundY * 0.45;
  const r = Math.max(W, H) * 0.6;
  const a = glowEnergy * 0.07 * boot;

  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  if(isAlert){
    g.addColorStop(0, `rgba(255,60,0,${a})`);
  } else {
    g.addColorStop(0, `rgba(0,180,255,${a})`);
  }
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ==============================================================
   DRAWING: VIGNETTE
   ============================================================== */
function drawVignette(){
  const cx = W / 2, cy = H / 2;
  const r = Math.max(W, H) * 0.72;
  const g = ctx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.15)');
  g.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ==============================================================
   DRAWING: SUBTLE SCANLINES (CRT effect)
   ============================================================== */
function drawCRTLines(){
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for(let y = 0; y < H; y += 3){
    ctx.fillRect(0, y, W, 1);
  }
}

/* ==============================================================
   DRAWING: BOOT OVERLAY
   ============================================================== */
function drawBootOverlay(now){
  const elapsed = now - bootStart;
  const t = clamp(elapsed / BOOT_MS, 0, 1);
  const eased = easeOutCubic(t);
  if(eased >= 1) return;

  // Black fade-out with slight slide
  const slideY = (1 - eased) * 40;
  ctx.fillStyle = `rgba(6,6,18,${1 - eased})`;
  ctx.fillRect(0, slideY - 40, W, H + 40);

  // Thin horizontal reveal line
  if(eased > 0.1 && eased < 0.9){
    const lineY = H * eased;
    const lineA = Math.sin(eased * Math.PI) * 0.6;
    const lg = ctx.createLinearGradient(0, lineY - 2, 0, lineY + 2);
    lg.addColorStop(0, 'rgba(0,240,255,0)');
    lg.addColorStop(0.5, `rgba(0,240,255,${lineA})`);
    lg.addColorStop(1, 'rgba(0,240,255,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, lineY - 2, W, 4);
  }

  return eased;
}

/* ==============================================================
   STATE TAG
   ============================================================== */
function updateTag(){
  const st = isAlert ? 'ALERT' : currentState.toUpperCase();
  tagEl.textContent = st;
  tagEl.style.color = isAlert
    ? `rgba(255,34,0,${0.6 + 0.4 * Math.sin(performance.now()*0.008)})`
    : 'rgba(0,240,255,0.55)';
  tagEl.style.textShadow = isAlert
    ? '0 0 8px rgba(255,34,0,0.5)'
    : '0 0 6px rgba(0,240,255,0.3)';
}

/* ==============================================================
   FPS TRACKING
   ============================================================== */
function updateFPS(now){
  frameTimes.push(now);
  while(frameTimes.length > 0 && frameTimes[0] < now - 1000) frameTimes.shift();
  if(fpsShow){
    fpsEl.style.display = 'block';
    fpsEl.textContent = frameTimes.length + ' FPS';
  } else {
    fpsEl.style.display = 'none';
  }
}

/* ==============================================================
   ANIMATION LOOP
   ============================================================== */
let prevTime = 0;

function frame(now){
  rafId = requestAnimationFrame(frame);

  if(!prevTime){ prevTime = now; bootStart = now; startTime = now; }
  const dt = Math.min((now - prevTime) * 0.001, 0.05); // seconds, capped
  prevTime = now;

  // Boot progress
  const bootElapsed = now - bootStart;
  const bootT = clamp(bootElapsed / BOOT_MS, 0, 1);
  const boot = easeOutCubic(bootT);

  // Update state & energy
  updateState(now, dt);

  const effState = isAlert ? 'alert' : currentState;
  const t = now - startTime;

  // --- CINEMATIC CAMERA ---
  const cineT = now / 1000;
  const cineTransform = getCineTransform(cineT);
  ctx.save();
  if(cineTransform) applyCineTransform(cineTransform);

  // --- DRAW ---
  ctx.clearRect(0, 0, W, H);

  // 1. Background
  drawBackground();

  // 2. Stars
  drawStars(t * 0.001, boot);

  // 3. Far buildings
  drawFarBuildings(clamp(boot * 1.3, 0, 1));

  // 4. Atmosphere
  drawAtmosphere();

  // 5. Data rain (behind near buildings)
  drawDataRain(t, dt, boot);

  // 6. Equalizer bars (behind near buildings)
  drawEqualizer(t, dt, boot);

  // 7. Near buildings (offscreen)
  drawNearBuildings(clamp(boot * 1.1, 0, 1));

  // 8. Windows
  drawWindows(t, effState, boot);

  // 9. Neon signs
  drawNeonSigns(t, effState, boot);

  // 10. Antenna blink
  drawAntennaBlink(t);

  // 11. Waveform
  drawWaveform(t, boot);

  // 12. Rain
  drawRain(t, dt, boot);

  // 13. Wet road
  drawWetRoad(boot);

  // 14. Reflections
  drawReflections(t, boot);

  // 15. Scan line
  drawScanLine(t, boot);

  // 16. Scene glow
  drawSceneGlow(boot);

  // 17. Alert overlay
  drawAlertOverlay(t, boot);

  // 18. Vignette
  drawVignette();

  // 19. CRT lines
  drawCRTLines();

  // 20. Boot overlay
  drawBootOverlay(now);

  // UI
  updateTag();
  updateFPS(now);

  // CINEMATIC: restore and draw HUD
  ctx.restore();
  if(cineTransform) drawCineHUD(cineTransform);
}

/* ==============================================================
   RESIZE HANDLER
   ============================================================== */
function handleResize(){
  setupCanvas();
  generateScene();
  bakeOffscreen();
}

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(handleResize, 150);
});

/* ==============================================================
   CINEMATIC PRESENTATION CAMERA
   ============================================================== */
let cineActive = false;
let cineShotQueue = [];
let cineCurrent = -1;
let cineShotStart = 0;
const CINE_FINALE_DURATION = 6;

const CINE_SHOT_POOL = [
  {name:'skyline-glide',  desc:'Long horizontal glide across the full city skyline'},
  {name:'neon-closeup',  desc:'Slow push into a blazing neon sign'},
  {name:'rooftop-descent',desc:'Vertical descent from rooftop antenna to street'},
  {name:'diagonal-cross', desc:'Corner-to-corner diagonal across the city'},
  {name:'street-level',  desc:'Low angle push down the wet road'},
  {name:'rain-closeup',  desc:'Close-up of rain hitting the road surface'},
];

function buildShotQueue(){
  const count = 4 + Math.floor(Math.random()*2);
  const prevName = cineCurrent >= 0 ? (cineShotQueue[cineCurrent]||{}).name : null;
  const finaleName = 'skyline-glide';
  const pool = CINE_SHOT_POOL.filter(s => s.name !== prevName && s.name !== finaleName);
  for(let i = pool.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  cineShotQueue = pool.slice(0,count).map(s => ({
    ...s, duration: 3 + Math.random()*3 + Math.random()*2
  }));
  cineShotQueue.push({name:finaleName, desc:'Pull-back to full wide city panorama', duration:CINE_FINALE_DURATION});
  cineCurrent = -1;
  cineShotStart = performance.now()/1000;
  cineActive = true;
  tagEl.style.display = 'none';
}

function advanceShot(){
  cineCurrent++;
  if(cineCurrent >= cineShotQueue.length){ cineActive = false; tagEl.style.display = ''; return; }
  cineShotStart = performance.now()/1000;
}

function getCineTransform(t){
  if(!cineActive || cineShotQueue.length===0) return null;
  const elapsed = t - cineShotStart;
  const shot = cineShotQueue[cineCurrent];
  if(!shot) return null;
  if(elapsed >= shot.duration){ advanceShot(); return getCineTransform(t); }
  if(!cineActive) return null;
  const p = elapsed / shot.duration;
  const isFinale = cineCurrent === cineShotQueue.length-1;
  const tilt = 0.03;
  let tx=0, ty=0, sc=1, rot=0;
  switch(shot.name){
    case 'skyline-glide':
      if(isFinale){ const ep=easeOutCubic(p); sc=1.8-ep*0.8; tx=W*0.15*(1-ep); ty=-H*0.1*(1-ep); rot=tilt*(1-ep); }
      else { tx=-W*0.8+p*W*1.6; ty=-H*0.15+Math.sin(p*Math.PI)*H*0.1; sc=1.2-p*0.15; rot=Math.sin(p*Math.PI*2)*tilt*0.5; }
      break;
    case 'neon-closeup': tx=W*0.1-p*W*0.05; ty=H*0.1+p*H*0.15; sc=1+p*0.8; rot=Math.sin(p*Math.PI)*tilt; break;
    case 'rooftop-descent': tx=W*0.05; ty=-H*0.5+p*H*0.7; sc=0.8+p*0.3; rot=Math.cos(p*Math.PI*0.5)*tilt; break;
    case 'diagonal-cross': tx=-W*0.3+p*W*0.6; ty=-H*0.3+p*H*0.6; sc=1.1+Math.sin(p*Math.PI)*0.2; rot=Math.sin(p*Math.PI*3)*tilt*0.7; break;
    case 'street-level': tx=p*W*0.3; ty=H*0.2-p*H*0.1; sc=1+p*0.5; rot=Math.sin(p*Math.PI*2)*tilt*0.3; break;
    case 'rain-closeup': tx=Math.sin(p*Math.PI*2)*W*0.05; ty=H*0.3+p*H*0.1; sc=2+p*1.5; rot=0; break;
  }
  return {tx,ty,sc,rot,progress:p,isFinale};
}

function applyCineTransform(tf){
  if(!tf) return;
  ctx.translate(W/2,H/2);
  ctx.rotate(tf.rot);
  ctx.scale(tf.sc,tf.sc);
  ctx.translate(-W/2-tf.tx,-H/2-tf.ty);
}

function drawCineHUD(tf){
  if(!tf||!cineActive) return;
  const shot = cineShotQueue[cineCurrent];
  if(!shot) return;
  const barH = H*0.08;
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.fillRect(0,0,W,barH);
  ctx.fillRect(0,H-barH,W,barH);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.font='12px Courier New';
  ctx.textAlign='right';
  ctx.fillText(`${cineCurrent+1}/${cineShotQueue.length} | ${shot.name.toUpperCase()}`, W-20, H-barH+20);
  const barW=W*0.3, barX=(W-barW)/2, barY=H-barH+30;
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.fillRect(barX,barY,barW,2);
  ctx.fillStyle='rgba(0,240,255,0.6)';
  ctx.fillRect(barX,barY,barW*tf.progress,2);
}

/* ==============================================================
   KEYBOARD
   ============================================================== */
window.addEventListener('keydown', e => {
  if(e.key==='f'||e.key==='F'){ fpsShow=!fpsShow; }
  if(e.key===' '||e.code==='Space'){
    e.preventDefault();
    if(cineActive){ cineActive=false; tagEl.style.display=''; }
    else { buildShotQueue(); }
  }
});

/* ==============================================================
   INITIALIZATION
   ============================================================== */
function init(){
  setupCanvas();
  generateScene();
  bakeOffscreen();
  lastServerTS = performance.now();
  startPolling();

  // Shot mode
  if(shotMode){
    setTimeout(() => {
      try {
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = `voice-viz-${shotMode.state}-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        console.log('[shot] Screenshot captured');
      } catch(e){
        console.log('[shot] Capture failed:', e);
      }
    }, shotMode.time);
  }

  rafId = requestAnimationFrame(frame);
}

init();
</script>
